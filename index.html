<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6B4426" />
<meta name="description" content="Rudra — premium fashion shopping demo. Frontend only, payments simulated." />
<title>Rudra — Rudraksha & Locket Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png" type="image/png">
<style>
/* ============ 1. RESET & TOKENS ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,h1,h2,h3,h4,p,figure,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

:root{
  --primary:#6B4426;
  --primary-rgb:107,66,38;
  --secondary:#EFDFC7;
  --secondary-rgb:239,223,199;
  --bg:#F6EBD8;
  --card:#FFFCF6;
  --text:#2B1810;
  --muted:rgba(43,24,16,.58);
  --accent:#3A2113;
  --accent-rgb:58,33,19;
  --charcoal:#3A2113;
  --on-primary:#FFF8EE;
  --line:#C9A57A;
  --ok:#2B1810;
  --warn:#EFDFC7;
  --danger:#A03B1E;
  --r-lg:26px;
  --r-md:18px;
  --r-sm:12px;
  --sh-sm:0 2px 10px rgba(43,24,16,.05);
  --sh:0 10px 28px rgba(43,24,16,.08);
  --sh-lg:0 20px 48px rgba(43,24,16,.16);
  --max:1240px;
  --nav-h:74px;
}

body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  line-height:1.5;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(760px 420px at 12% -8%, rgba(var(--primary-rgb),.16), transparent 62%),
    radial-gradient(620px 380px at 96% 4%, rgba(var(--secondary-rgb),.9), transparent 60%),
    radial-gradient(700px 500px at 50% 108%, rgba(var(--secondary-rgb),.75), transparent 65%),
    var(--bg);
}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:3px;border-radius:8px}
::selection{background:var(--primary);color:var(--on-primary)}

/* ============ 2. LAYOUT ============ */
.app{min-height:100vh;display:flex;flex-direction:column}
.main{width:100%;max-width:var(--max);margin:0 auto;padding:0 16px calc(var(--nav-h) + 42px + env(safe-area-inset-bottom));flex:1}
.page{animation:pageIn .34s cubic-bezier(.22,.7,.3,1) both}
.wrap{max-width:860px;margin:0 auto;width:100%}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.spacer{flex:1}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.sec{margin-top:26px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-title{font-size:1.06rem;font-weight:700;letter-spacing:-.01em}
.sec-sub{font-size:.78rem;color:var(--muted)}
.link-more{display:inline-flex;align-items:center;gap:2px;font-size:.8rem;font-weight:600;color:#2B1810;background:rgba(var(--primary-rgb),.1);padding:7px 12px;border-radius:999px;transition:background .2s,transform .2s}
.link-more:hover{background:rgba(var(--primary-rgb),.18)}
.link-more:active{transform:scale(.95)}

/* ============ 3. HEADER / SEARCH ============ */
.hdr{position:sticky;top:0;z-index:60;background:rgba(246,235,216,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:var(--max);margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.16em;font-size:.94rem;flex:none}
.logo-mark{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--accent));color:var(--on-primary);display:grid;place-items:center;font-size:.95rem;font-weight:800;letter-spacing:0;box-shadow:0 6px 16px rgba(var(--primary-rgb),.35);overflow:hidden;flex:none}
.logo-mark img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.hdr-search{flex:1;max-width:520px;margin:0 auto}
.hdr-links{display:none;gap:4px}
.hdr-link{padding:9px 14px;border-radius:999px;font-size:.9rem;font-weight:600;color:#2B1810;transition:background .2s,color .2s}
.hdr-link:hover{background:var(--secondary)}
.hdr-link.active{background:var(--primary);color:var(--on-primary)}

.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--sh-sm);transition:transform .2s,box-shadow .2s}
.icon-btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.icon-btn:active{transform:scale(.92)}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:.68rem;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);animation:bump .4s cubic-bezier(.34,1.56,.64,1)}
.badge.pop{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}

.search{position:relative}
.search-box{display:flex;align-items:center;gap:10px;background:var(--secondary);border-radius:999px;padding:0 16px;height:48px;transition:box-shadow .28s,background .28s,transform .28s;border:1.5px solid transparent}
.search-box:focus-within{background:#fff;border-color:rgba(var(--primary-rgb),.55);box-shadow:0 10px 26px rgba(var(--primary-rgb),.18)}
.search-box input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:.94rem}
.search-box input::placeholder{color:rgba(43,24,16,.45)}
.search-clear{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(43,24,16,.07);color:rgba(43,24,16,.6)}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 10px);background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-lg);padding:8px;z-index:70;overflow:hidden;animation:dropIn .22s ease both;border:1px solid var(--line)}
.sug{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:12px;text-align:left;transition:background .18s}
.sug:hover{background:var(--bg)}
.sug img{width:44px;height:52px;object-fit:cover;border-radius:9px;flex:none;background:var(--secondary)}
.sug-name{font-size:.87rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug-meta{font-size:.74rem;color:var(--muted)}
.sug-foot{padding:10px 12px;font-size:.8rem;font-weight:600;color:#2B1810;border-top:1px solid var(--line);margin-top:6px;width:100%;text-align:left}

/* ============ 4. CHIPS ============ */
.chips{display:flex;gap:9px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;padding:9px 15px;border-radius:999px;background:#fff;box-shadow:var(--sh-sm);font-size:.82rem;font-weight:600;color:#2B1810;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:color .25s,background .25s,box-shadow .25s,transform .18s}
.chip:hover{transform:translateY(-1px)}
.chip.active{background:var(--primary);color:var(--on-primary);box-shadow:0 8px 20px rgba(var(--primary-rgb),.32)}
.chip.mini{padding:7px 13px;font-size:.78rem}

/* ============ 5. HERO BANNER ============ */
.hero{position:relative;margin-top:14px;border-radius:var(--r-lg);overflow:hidden;min-height:196px;display:flex;align-items:center;box-shadow:var(--sh);background:linear-gradient(120deg,var(--secondary) 0%,var(--secondary) 52%,var(--primary) 100%)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 78% 20%,rgba(255,255,255,.5),transparent 60%);pointer-events:none}
.hero-art{position:absolute;inset:0;animation:bgFloat 14s ease-in-out infinite alternate}
.hero-deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.42);filter:blur(.4px)}
.hero-body{position:relative;z-index:3;padding:22px 20px 36px;max-width:66%;animation:heroText .5s cubic-bezier(.22,.7,.3,1) both}
.hero-kicker{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#2B1810;background:rgba(255,255,255,.75);padding:5px 10px;border-radius:999px;margin-bottom:10px}
.hero-title{font-family:'Playfair Display',Georgia,serif;font-size:1.24rem;line-height:1.18;font-weight:700;letter-spacing:-.01em}
.hero-sub{font-size:.82rem;color:#2B1810;margin-top:6px}
.hero-cta{margin-top:16px;display:inline-flex;align-items:center;gap:8px;background:var(--charcoal);color:#FFFFFF;padding:11px 20px;border-radius:999px;font-size:.83rem;font-weight:600;box-shadow:0 10px 22px rgba(43,24,16,.28);transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,background .22s}
.hero-cta:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 14px 28px rgba(43,24,16,.34)}
.hero-cta:active{transform:scale(.94)}
.hero-model{position:absolute;right:0;top:0;bottom:0;width:58%;z-index:2;overflow:hidden}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;opacity:0;transition:opacity .8s ease;
  -webkit-mask-image:linear-gradient(to right,transparent 0,rgba(43,24,16,.28) 16%,#2B1810 46%);
  mask-image:linear-gradient(to right,transparent 0,rgba(43,24,16,.28) 16%,#2B1810 46%)}
.hero-img.on{opacity:1}
.hero-dots{position:absolute;left:20px;bottom:14px;display:flex;gap:6px;z-index:4}
.dot{width:7px;height:7px;border-radius:999px;background:rgba(43,24,16,.2);transition:all .3s}
.dot.active{width:22px;background:var(--charcoal)}
@keyframes heroText{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ============ 6. BRANDS ============ */
.brands{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.brands::-webkit-scrollbar{display:none}
.brand{flex:none;scroll-snap-align:start;width:66px;display:flex;flex-direction:column;align-items:center;gap:8px}
.brand-logo{width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);display:grid;place-items:center;font-weight:800;font-size:.56rem;letter-spacing:.04em;color:#2B1810;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,background .25s,color .25s;border:1.5px solid transparent}
.brand:hover .brand-logo{transform:translateY(-4px) scale(1.04);box-shadow:var(--sh)}
.brand.on .brand-logo{background:var(--primary);color:var(--on-primary);box-shadow:0 10px 24px rgba(var(--primary-rgb),.36);transform:scale(1.06)}
.brand-name{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.2;font-weight:600}
.brand.on .brand-name{color:#2B1810}

/* ============ 7. PRODUCT CARD / GRID ============ */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm);transition:transform .3s cubic-bezier(.22,.7,.3,1),box-shadow .3s;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh-lg)}
.card-media{position:relative;display:block;width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--secondary)}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .55s cubic-bezier(.22,.7,.3,1)}
.card:hover .card-media img{transform:scale(1.08)}
.fav-btn{position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:var(--sh-sm);transition:transform .2s,background .2s;z-index:2}
.fav-btn:active{transform:scale(.85)}
.fav-btn.on{color:#2B1810}
.fav-btn.pop svg{animation:heartPop .5s cubic-bezier(.34,1.56,.64,1)}
.tag{position:absolute;top:9px;left:9px;background:var(--accent);color:#FFFFFF;font-size:.66rem;font-weight:700;padding:4px 9px;border-radius:999px;z-index:2;box-shadow:0 6px 14px rgba(43,24,16,.18);letter-spacing:.02em}
.rating-mini{position:absolute;left:9px;bottom:9px;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.94);color:var(--text);font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:999px;z-index:2}
.card-body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.card-row{display:flex;align-items:flex-start;gap:8px}
.card-name{font-size:.85rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:.7rem;color:var(--muted);margin-top:2px}
.add-btn{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 8px 18px rgba(var(--primary-rgb),.36);transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .2s}
.add-btn:hover{background:var(--secondary);transform:scale(1.1) rotate(90deg)}
.add-btn:active{transform:scale(.88)}
.card-price{display:flex;align-items:baseline;gap:7px;margin-top:auto}
.price{font-size:.98rem;font-weight:700}
.mr{font-size:.76rem;color:var(--muted);text-decoration:line-through}

/* skeleton */
.sk{border-radius:var(--r-md);background:linear-gradient(100deg,var(--secondary) 20%,var(--primary) 40%,var(--secondary) 60%);background-size:220% 100%;animation:shimmer 1.25s linear infinite}
.sk-card{background:var(--card);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm)}
.sk-media{aspect-ratio:3/4}
.sk-line{height:11px;border-radius:6px;margin:12px}
.sk-line.w60{width:60%}

/* ============ 8. PRODUCT DETAILS ============ */
.pdp{display:flex;flex-direction:column;gap:22px;padding-top:12px}
.pdp-gallery{display:flex;flex-direction:column;gap:12px}
.thumbs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;animation:fadeIn .4s both}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:none;width:64px;height:80px;border-radius:12px;overflow:hidden;border:2.5px solid transparent;background:var(--secondary);transition:border-color .25s,transform .2s}
.thumb{position:relative}
.thumb.on{border-color:var(--primary)}
.thumb.on-colour{border-color:var(--accent);transform:translateY(-2px)}
.thumb-dot{position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(43,24,16,.32);z-index:2}
.thumb:active{transform:scale(.94)}
.pdp-info{display:flex;flex-direction:column;gap:16px}
.pdp-brand{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:#2B1810;font-weight:700}
.pdp-title{font-size:1.42rem;font-weight:700;letter-spacing:-.02em;line-height:1.22}
.pdp-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pdp-price .price{font-size:1.5rem}
.stars{display:inline-flex;align-items:center;gap:4px}
.stars svg{color:#2B1810}
.rev-count{font-size:.78rem;color:var(--muted)}
.desc{font-size:.88rem;color:#2B1810;line-height:1.7}
.opt-label{display:flex;align-items:baseline;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#2B1810}
.opt-label span{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.opt-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.size{min-width:46px;padding:10px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:.84rem;font-weight:600;transition:all .22s cubic-bezier(.34,1.56,.64,1)}
.size:hover{border-color:rgba(var(--primary-rgb),.6)}
.size.on{background:var(--charcoal);border-color:var(--charcoal);color:#FFFFFF;transform:translateY(-2px)}
.swatch{width:36px;height:36px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--line);transition:transform .22s,box-shadow .22s}
.swatch.on{transform:scale(1.12);box-shadow:0 0 0 2.5px var(--primary)}
.qty{display:inline-flex;align-items:center;background:#fff;border-radius:999px;padding:5px;box-shadow:var(--sh-sm);gap:2px}
.qty button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:background .2s,color .2s}
.qty button:hover{background:var(--secondary)}
.qty span{min-width:34px;text-align:center;font-weight:700;font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 24px;border-radius:999px;font-weight:700;font-size:.92rem;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,background .25s,color .25s}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:0 12px 26px rgba(var(--primary-rgb),.34)}
.btn-primary:hover{background:var(--accent);color:#FFFFFF;transform:translateY(-2px)}
.btn-dark{background:var(--charcoal);color:#FFFFFF;box-shadow:0 12px 26px rgba(43,24,16,.26)}
.btn-dark:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(43,24,16,.32)}
.btn-ghost{background:#fff;color:var(--text);box-shadow:var(--sh-sm)}
.btn-ghost:hover{background:var(--secondary)}
.btn-block{width:100%}
.btn:disabled{opacity:.55;box-shadow:none;cursor:not-allowed;transform:none}

/* ============ 9. BOTTOM NAV ============ */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:80;width:min(430px,calc(100% - 26px));background:rgba(var(--accent-rgb),.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:999px;padding:8px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 18px 40px rgba(43,24,16,.4);animation:navUp .5s cubic-bezier(.22,.7,.3,1) both}
.nav-item{flex:1;display:flex;align-items:center;justify-content:center;height:48px;border-radius:999px;color:rgba(255,246,233,.75);transition:color .25s,background .35s cubic-bezier(.34,1.56,.64,1),transform .2s;position:relative}
.nav-item:hover{color:#FFF6E9}
.nav-item:active{transform:scale(.9)}
.nav-item.on{background:var(--secondary);color:var(--accent);box-shadow:0 8px 20px rgba(0,0,0,.28)}
.nav-item.on svg{animation:popIcon .45s cubic-bezier(.34,1.56,.64,1)}
.nav-label{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:.58rem;opacity:0;transition:opacity .3s;white-space:nowrap}

/* ============ 10. PAGES (cart / wishlist / orders / profile / checkout) ============ */
.page-head{display:flex;align-items:center;gap:12px;padding:16px 0 6px;position:sticky;top:112px;z-index:40;background:linear-gradient(var(--bg) 74%,rgba(255,255,255,0))}
.page-title{font-size:1.22rem;font-weight:700;letter-spacing:-.01em}
.back-btn{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh-sm);transition:transform .2s}
.back-btn:hover{transform:translateX(-3px)}
.back-btn:active{transform:scale(.9)}

.card-p{background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:14px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:56px 20px;animation:fadeIn .45s both}
.empty-art{width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,var(--secondary));display:grid;place-items:center;color:#2B1810;box-shadow:var(--sh)}
.empty h3{font-size:1.05rem;font-weight:700}
.empty p{font-size:.85rem;color:var(--muted);max-width:290px}

.line-item{display:flex;gap:13px;padding:13px;background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-sm);animation:slideUp .4s both}
.line-item img{width:82px;height:104px;border-radius:12px;object-fit:cover;background:var(--secondary);flex:none}
.li-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.li-name{font-size:.87rem;font-weight:600;line-height:1.3}
.li-meta{font-size:.72rem;color:var(--muted)}
.li-foot{display:flex;align-items:center;gap:10px;margin-top:auto}
.qty-sm{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:999px;padding:2px}
.qty-sm button{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:rgba(43,24,16,.6);transition:background .2s}
.qty-sm button:hover{background:var(--secondary)}
.qty-sm span{min-width:26px;text-align:center;font-size:.82rem;font-weight:700}
.rm{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:rgba(43,24,16,.45);transition:background .2s,color .2s}
.rm:hover{background:var(--primary);color:var(--on-primary)}

.summary{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh);padding:18px;margin-top:16px}
.sum-row{display:flex;justify-content:space-between;align-items:center;font-size:.87rem;padding:7px 0;color:#2B1810}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;font-size:1.05rem;font-weight:800;padding-top:12px;margin-top:8px;border-top:1px dashed var(--line)}
.free-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(var(--primary-rgb),.1);color:#2B1810;font-size:.74rem;font-weight:700;padding:7px 12px;border-radius:999px}
.progress{height:7px;border-radius:999px;background:var(--secondary);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s cubic-bezier(.22,.7,.3,1)}

.form{display:flex;flex-direction:column;gap:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.76rem;font-weight:700;color:#2B1810;letter-spacing:.02em}
.input{height:48px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 15px;outline:none;font-size:.9rem;transition:border-color .22s,box-shadow .22s;width:100%}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(var(--primary-rgb),.13)}
.input.err{border-color:var(--danger);box-shadow:0 0 0 4px rgba(var(--primary-rgb),.12)}
.err-msg{font-size:.72rem;color:#2B1810;font-weight:600}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:13px}

.pay{display:flex;align-items:center;gap:13px;padding:14px;border-radius:var(--r-md);background:#fff;border:1.5px solid var(--line);width:100%;text-align:left;transition:all .25s}
.pay.on{border-color:var(--primary);background:linear-gradient(90deg,rgba(var(--secondary-rgb),.7),#fff);box-shadow:0 8px 20px rgba(var(--primary-rgb),.14)}
.pay-ico{width:42px;height:42px;border-radius:12px;background:var(--secondary);color:#2B1810;display:grid;place-items:center;flex:none}
.pay-name{font-size:.88rem;font-weight:700}
.pay-desc{font-size:.73rem;color:var(--muted)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-left:auto;flex:none;display:grid;place-items:center;transition:all .25s}
.pay.on .radio{border-color:var(--primary)}
.pay.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary);animation:popIcon .3s}
.demo-note{display:flex;gap:9px;align-items:flex-start;background:var(--secondary);border:1px solid var(--line);color:#2B1810;border-radius:14px;padding:11px 13px;font-size:.76rem;line-height:1.5}

/* checkout location map (satellite, zoom locked) */
.loc-map{height:240px;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);margin-top:10px;background:var(--secondary);position:relative;z-index:1}
.loc-map .leaflet-container{width:100%;height:100%;font-family:inherit}
.loc-map .leaflet-control-attribution{font-size:.6rem;background:rgba(255,255,255,.8)}
.loc-pin{position:absolute;top:10px;left:10px;z-index:500;background:rgba(var(--primary-rgb),.88);color:var(--on-primary);font-size:.72rem;font-weight:600;padding:6px 12px;border-radius:999px;pointer-events:none;display:flex;align-items:center;gap:6px}
.loc-pin i{width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;animation:locPulse 1.4s ease-in-out infinite}
@keyframes locPulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

.order{border-radius:var(--r-md);background:#fff;box-shadow:var(--sh-sm);padding:14px;display:flex;flex-direction:column;gap:12px;animation:slideUp .4s both}
.order-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.order-id{font-size:.78rem;font-weight:700;letter-spacing:.02em}
.status{margin-left:auto;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px}
.st-processing{background:rgba(var(--primary-rgb),.13);color:#2B1810}
.st-shipped{background:rgba(var(--primary-rgb),.11);color:#2B1810}
.st-delivered{background:rgba(var(--primary-rgb),.12);color:#2B1810}
.st-cancelled{background:rgba(var(--primary-rgb),.11);color:#2B1810}
.order-thumbs{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
.order-thumbs::-webkit-scrollbar{display:none}
.order-thumbs img{width:54px;height:68px;border-radius:10px;object-fit:cover;background:var(--secondary);flex:none}
.order-foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:11px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}

.profile-hero{display:flex;align-items:center;gap:16px;padding:20px;border-radius:var(--r-lg);background:linear-gradient(120deg,var(--secondary),var(--secondary) 55%,var(--primary));box-shadow:var(--sh-sm)}
.avatar{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.4rem;font-weight:800;color:#2B1810;box-shadow:var(--sh);flex:none}
.list-row{display:flex;align-items:center;gap:14px;padding:15px;background:#fff;width:100%;text-align:left;transition:background .2s}
.list-row+.list-row{border-top:1px solid var(--line)}
.list-row:hover{background:var(--bg)}
.list-ico{width:40px;height:40px;border-radius:13px;background:var(--secondary);color:#2B1810;display:grid;place-items:center;flex:none}
.list-name{font-size:.89rem;font-weight:600}
.list-desc{font-size:.74rem;color:var(--muted)}
.chev{margin-left:auto;color:rgba(43,24,16,.3)}

.collection{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:158px;display:flex;align-items:flex-end;box-shadow:var(--sh-sm);transition:transform .3s cubic-bezier(.22,.7,.3,1),box-shadow .3s}
.collection:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.collection img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.collection:hover img{transform:scale(1.07)}
.collection::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(43,24,16,.72),rgba(43,24,16,.05) 62%)}
.collection-body{position:relative;z-index:2;padding:16px;color:#fff;width:100%}
.collection-name{display:block;font-size:1rem;font-weight:700}
.collection-sub{display:block;font-size:.74rem;opacity:.88;margin-top:2px}

/* offers row (home) */
.offers-row{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.offers-row::-webkit-scrollbar{display:none}
.offer-card{flex:none;width:232px;scroll-snap-align:start;background:#fff;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm);text-align:left;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.22,.7,.3,1),box-shadow .3s;animation:slideUp .5s cubic-bezier(.22,.7,.3,1) both}
.offer-card:hover{transform:translateY(-5px);box-shadow:var(--sh-lg)}
.offer-media{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--secondary)}
.offer-media img{width:100%;height:100%;object-fit:cover;transition:transform .55s cubic-bezier(.22,.7,.3,1)}
.offer-card:hover .offer-media img{transform:scale(1.08)}
.offer-glow{position:absolute;inset:0;background:linear-gradient(120deg,rgba(var(--primary-rgb),.28),transparent 55%);pointer-events:none}
.offer-badge{position:absolute;top:8px;left:8px;background:rgba(var(--primary-rgb),.86);color:var(--on-primary);font-size:.64rem;font-weight:800;letter-spacing:.04em;padding:4px 9px;border-radius:999px;backdrop-filter:blur(6px)}
.offer-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.offer-title{font-size:.86rem;font-weight:700;line-height:1.25}
.offer-sub{font-size:.72rem;color:var(--muted)}
.offer-cta{margin-top:7px;display:inline-flex;align-items:center;gap:3px;font-size:.74rem;font-weight:800;color:#2B1810}
.offer-card:hover .offer-cta svg{transform:translateX(3px)}
.offer-cta svg{transition:transform .25s}

/* offer detail page */
.offer-hero{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:150px;display:flex;align-items:flex-end;margin-top:12px;box-shadow:var(--sh-sm);background:linear-gradient(120deg,var(--secondary),var(--secondary) 55%,var(--primary))}
.offer-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.offer-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(43,24,16,.78),rgba(43,24,16,.06) 65%)}
.offer-hero-body{position:relative;z-index:2;padding:18px;color:#fff}
.offer-hero-body h2{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.offer-hero-body p{font-size:.8rem;opacity:.9;margin-top:3px}

/* confirmation */
.confirm{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:44px 20px;animation:fadeIn .4s both}
.confirm-ring{width:104px;height:104px}
.confirm-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.confirm-ring .trk{stroke:var(--secondary)}
.confirm-ring .bar{stroke:var(--primary);stroke-dasharray:326;stroke-dashoffset:326;animation:draw .85s cubic-bezier(.22,.7,.3,1) .15s forwards}
.confirm-tick{stroke:var(--ok);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:draw .4s ease .75s forwards}
.confirm h2{font-size:1.32rem;font-weight:800;letter-spacing:-.01em}
.confirm p{font-size:.87rem;color:var(--muted);max-width:340px}
.order-box{width:100%;max-width:420px;background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:16px;margin-top:14px;text-align:left;display:flex;flex-direction:column;gap:9px}
.order-box .sum-row{font-size:.83rem}

/* ---- customer reviews ---- */
.rev{margin-top:26px;background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh);padding:16px}
.rev-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rev-pill{display:inline-flex;align-items:center;gap:5px;background:var(--primary);color:var(--on-primary);font-size:.76rem;font-weight:800;padding:6px 12px;border-radius:999px}
.rev-gate{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border:1.5px dashed var(--line);border-radius:var(--r-md);padding:14px}
.rev-gate p{flex:1;min-width:190px;margin:0;font-size:.83rem;color:var(--muted)}
.rev-form{background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:11px;margin-bottom:6px}
.rev-form textarea{width:100%;min-height:80px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:11px 14px;outline:none;font-size:.87rem;font-family:inherit;resize:vertical;transition:border-color .2s,box-shadow .2s}
.rev-form textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(var(--primary-rgb),.13)}
.rev-label{font-size:.78rem;font-weight:700;letter-spacing:.02em;color:#2B1810}
.rev-pick{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.rev-pick button{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;transition:transform .18s,background .18s}
.rev-pick button:hover{transform:translateY(-2px);background:rgba(var(--primary-rgb),.2)}
.rev-pick button:active{transform:scale(.9)}
.rev-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rev-item{display:flex;gap:12px;padding:14px 0;border-top:1px dashed var(--line);animation:slideUp .35s both}
.rev-item:first-of-type{border-top:none;padding-top:4px}
.rev-ava{width:38px;height:38px;border-radius:50%;background:var(--secondary);color:#2B1810;display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none;overflow:hidden}
.rev-ava img{width:100%;height:100%;object-fit:cover}
.rev-name{font-size:.85rem;font-weight:700}
.rev-meta{font-size:.72rem;color:var(--muted)}
.rev-you{display:inline-block;font-size:.6rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--warn);color:#2B1810;padding:3px 8px;border-radius:999px}
.rev-text{font-size:.86rem;line-height:1.65;color:#2B1810;margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.rev-empty{text-align:center;padding:12px 6px 4px;margin:0;font-size:.84rem;color:var(--muted)}

/* ============ 11. TOASTS & MODAL ============ */
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));z-index:200;display:flex;flex-direction:column;gap:9px;width:min(400px,calc(100% - 28px));pointer-events:none}
.toast{display:flex;align-items:center;gap:11px;background:rgba(var(--accent-rgb),.94);color:#FFF6E9;border-radius:16px;padding:12px 15px;box-shadow:0 16px 34px rgba(43,24,16,.32);animation:toastIn .38s cubic-bezier(.34,1.56,.64,1) both;font-size:.85rem;font-weight:500;backdrop-filter:blur(10px)}
.toast.out{animation:toastOut .3s ease forwards}
.toast-ico{width:26px;height:26px;border-radius:50%;background:var(--primary);display:grid;place-items:center;flex:none}

.scrim{position:fixed;inset:0;background:rgba(43,24,16,.45);backdrop-filter:blur(4px);z-index:150;display:grid;place-items:center;padding:18px;animation:fadeIn .25s both}
.modal{width:min(430px,100%);background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-lg);padding:22px;animation:modalIn .38s cubic-bezier(.34,1.56,.64,1) both;max-height:88vh;overflow-y:auto}
.modal h3{font-size:1.08rem;font-weight:800;letter-spacing:-.01em}
.modal p{font-size:.85rem;color:var(--muted);margin-top:6px}
.gbtn{background:#fff;border:1.5px solid var(--line);box-shadow:var(--sh-sm);gap:10px}
.gbtn:hover{background:var(--bg)}
.gbtn:disabled{opacity:.85}
.avatar-img{width:100%;height:100%;object-fit:cover;border-radius:50%}
/* product image lightbox */
.lb{background:rgba(43,24,16,.92);z-index:180}
.lb-stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.lb-bar{display:flex;align-items:center;gap:8px;background:rgba(var(--accent-rgb),.92);border-radius:999px;padding:6px 10px;box-shadow:var(--sh-lg)}
.lb-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#FFF6E9;transition:background .2s,transform .15s}
.lb-btn:hover{background:rgba(255,246,233,.18)}
.lb-btn:active{transform:scale(.9)}
.lb-count{color:#FFF6E9;font-size:.8rem;font-weight:700;min-width:46px;text-align:center}
.zoom-hint{position:absolute;right:9px;bottom:9px;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);color:#2B1810;font-size:.66rem;font-weight:700;padding:4px 9px;border-radius:999px;z-index:2;box-shadow:var(--sh-sm)}

/* ============ 12. ANIMATIONS ============ */
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes navUp{from{opacity:0;transform:translate(-50%,26px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes popIcon{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes heartPop{0%{transform:scale(1)}35%{transform:scale(1.45)}60%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes shimmer{from{background-position:180% 0}to{background-position:-80% 0}}
@keyframes bgFloat{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-3%,2%,0) scale(1.08)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes toastIn{from{opacity:0;transform:translateY(-18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-14px) scale(.96)}}
@keyframes modalIn{from{opacity:0;transform:translateY(26px) scale(.94)}to{opacity:1;transform:none}}
@keyframes spinDot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s cubic-bezier(.22,.7,.3,1),transform .6s cubic-bezier(.22,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}
.floaty{animation:floaty 6s ease-in-out infinite}
.dots-load{display:inline-flex;gap:4px}
.dots-load i{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:spinDot 1s infinite}
.dots-load i:nth-child(2){animation-delay:.15s}
.dots-load i:nth-child(3){animation-delay:.3s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  .reveal{opacity:1;transform:none}
}

/* ============ 13. RESPONSIVE ============ */
@media (min-width:520px){ .hero{min-height:228px} .hero-title{font-size:1.5rem} .grid{gap:16px} }
@media (min-width:640px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pdp{flex-direction:row;gap:28px}
  .pdp-gallery{width:44%}
  .pdp-info{flex:1}
  .collections-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .profile-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
}
@media (min-width:1024px){
  :root{--nav-h:0px}
  .main{padding:0 28px 56px}
  .hdr-links{display:flex}
  .bnav{display:none}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) 356px;gap:26px;align-items:start}
  .split .summary{position:sticky;top:96px;margin-top:0}
  .hero{min-height:326px}
  .hero-body{max-width:50%;padding:34px 34px 46px}
  .hero-title{font-size:2.35rem}
  .hero-sub{font-size:.95rem}
  .hero-model{width:46%}
  .hero-dots{bottom:22px;left:34px}
  .collections-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sec{margin-top:36px}
  .sec-title{font-size:1.2rem}
  .pdp-title{font-size:1.9rem}
  .page-head{top:70px}
}
@media (min-width:1280px){
  .collections-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>

function Icon({ name, size = 22, stroke = 1.8, className = '', style = {} }) {
  const paths = ICON_PATHS[name] || [];
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round"
      className={className} style={style} aria-hidden="true" focusable="false">
      {paths.map((d, i) => <path key={i} d={d} />)}
    </svg>
  );
}

function StarRating({ value = 0, size = 14, showValue = false }) {
  const full = Math.round(value);
  return (
    <span className="stars" style={{ gap: 2 }} aria-label={'Rated ' + value + ' out of 5'}>
      {[1, 2, 3, 4, 5].map(i => (
        <Icon key={i} name="star" size={size} stroke={1.6}
          style={{ color: i <= full ? '#2B1810' : 'rgba(43,24,16,.3)', fill: i <= full ? 'var(--secondary)' : 'none' }} />
      ))}
      {showValue && <span style={{ fontSize: '.76rem', fontWeight: 700, marginLeft: 4 }}>{value.toFixed(1)}</span>}
    </span>
  );
}

const storage = {
  read(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  write(key, value) {
    try { window.localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  },
  remove(key) { try { window.localStorage.removeItem(key); } catch (e) {} }
};

/* drop empty/blank image entries so a colour never renders an empty gallery */
function cleanColorImages(cm) {
  const out = {};
  if (!cm || typeof cm !== 'object') return out;
  Object.keys(cm).forEach(k => {
    const arr = Array.isArray(cm[k]) ? cm[k].filter(Boolean) : [];
    if (arr.length) out[k] = arr;
  });
  return out;
}

function normalizeProduct(doc) {
  const x = doc.data() || {};
  const price = Number(x.price) || 0;
  return {
    id: doc.id,
    name: x.name || 'Untitled product',
    brand: x.brand || '',
    category: x.category || 'Fashion',
    price: price,
    originalPrice: Number(x.originalPrice) || price,
    rating: Number(x.rating) || 4.5,
    reviews: Number(x.reviews) || 0,
    popularity: Number(x.popularity) || 70,
    sizes: Array.isArray(x.sizes) && x.sizes.length ? x.sizes : ['Free Size'],
    sizePrices: (x.sizePrices && typeof x.sizePrices === 'object') ? x.sizePrices : {},
    colors: Array.isArray(x.colors) && x.colors.length
      ? x.colors.filter((c, i, a) => a.indexOf(c) === i)
      : ['#6B4426'],
    images: Array.isArray(x.images) ? x.images.filter(Boolean) : [],
    colorImages: cleanColorImages(x.colorImages),
    colorNames: (x.colorNames && typeof x.colorNames === 'object') ? x.colorNames : {},
    description: x.description || '',
    collection: Array.isArray(x.collection) ? x.collection : []
  };
}

/* Live catalog from Firestore: if the admin has added anything, the store
   shows ONLY that data; otherwise the built-in demo catalogue is used. */
let dbLoaded = false;
let refreshTimer = null;
let renderApp = function () {};
function flagCatalogRefresh() {
  if (!dbLoaded) return;
  window.clearTimeout(refreshTimer);
  refreshTimer = window.setTimeout(function () { renderApp(); }, 250);
}
function loadCatalog() {
  if (!db) return Promise.resolve(false);
  return new Promise(function (resolve) {
    let pending = 5, finished = false;
    const done = () => {
      if (finished) return;
      finished = true;
      dbLoaded = true;
      resolve(true);
    };
    const timer = window.setTimeout(done, 7000);
    const bump = () => { pending -= 1; if (pending <= 0) { window.clearTimeout(timer); done(); } };
    const fail = () => bump();
    try {
      db.collection('products').limit(500).onSnapshot(snap => {
        if (!snap.empty) {
          PRODUCTS = snap.docs.map(normalizeProduct);
          PRODUCT_MAP = PRODUCTS.reduce((acc, p) => { acc[p.id] = p; return acc; }, {});
        } else {
          PRODUCTS = SEED.products;
          PRODUCT_MAP = SEED.map;
        }
        bump(); flagCatalogRefresh();
      }, fail);
      db.collection('brands').limit(100).onSnapshot(snap => {
        if (!snap.empty) {
          BRANDS = snap.docs.map(d => {
            const x = d.data() || {};
            const name = x.name || 'Brand';
            return { id: d.id, name: name, mark: x.mark || name.toUpperCase().replace(/[^A-Z0-9& ]/g, '').slice(0, 6), image: x.image || '' };
          });
          BRAND_NAME = {};
          BRANDS.forEach(b => { BRAND_NAME[b.id] = b.name; });
        } else {
          BRANDS = SEED.brands;
          BRAND_NAME = SEED.brandName;
        }
        bump(); flagCatalogRefresh();
      }, fail);
      db.collection('categories').limit(100).onSnapshot(snap => {
        if (!snap.empty) {
          const names = snap.docs.map(d => (d.data() || {}).name).filter(Boolean)
            .filter(n => n !== 'All Categories');
          if (names.length) CATEGORIES = ['All Categories'].concat(names);
        } else {
          CATEGORIES = SEED.categories;
        }
        bump(); flagCatalogRefresh();
      }, fail);
      db.collection('banners').limit(20).onSnapshot(snap => {
        BANNERS = snap.empty ? DEFAULT_BANNERS.slice() : snap.docs.map(normalizeBanner);
        bump(); flagCatalogRefresh();
      }, fail);
      db.collection('offers').limit(50).onSnapshot(snap => {
        OFFERS = snap.empty ? DEFAULT_OFFERS.slice() : snap.docs.map(normalizeOffer);
        bump(); flagCatalogRefresh();
      }, fail);
    } catch (e) { window.clearTimeout(timer); done(); }
  });
}

/* =========================================================
   THEME PALETTE — colour picked in admin → General applies live
   ========================================================= */
const DEFAULT_THEME = '#6B4426';
let lastTheme = '';
function hexToRgb(hex) {
  let h = String(hex || '').replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  const n = parseInt(h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function rgbToHex(r, g, b) {
  const f = v => { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? '0' : '') + v.toString(16); };
  return '#' + f(r) + f(g) + f(b);
}
function mixRgb(a, b, t) { return { r: a.r + (b.r - a.r) * t, g: a.g + (b.g - a.g) * t, b: a.b + (b.b - a.b) * t }; }
function applyThemeColor(hex) {
  const p = hexToRgb(hex);
  if (!p) return false;
  const key = rgbToHex(p.r, p.g, p.b);
  if (key === lastTheme) return true;
  lastTheme = key;
  const accent = mixRgb(p, { r: 0, g: 0, b: 0 }, 0.42);
  const line = mixRgb(p, { r: 255, g: 255, b: 255 }, 0.60);
  const sec = mixRgb(p, { r: 255, g: 250, b: 242 }, 0.85);
  const st = document.documentElement.style;
  st.setProperty('--primary', key);
  st.setProperty('--primary-rgb', p.r + ',' + p.g + ',' + p.b);
  st.setProperty('--accent', rgbToHex(accent.r, accent.g, accent.b));
  st.setProperty('--accent-rgb', Math.round(accent.r) + ',' + Math.round(accent.g) + ',' + Math.round(accent.b));
  st.setProperty('--charcoal', rgbToHex(accent.r, accent.g, accent.b));
  st.setProperty('--line', rgbToHex(line.r, line.g, line.b));
  st.setProperty('--secondary', rgbToHex(sec.r, sec.g, sec.b));
  st.setProperty('--secondary-rgb', Math.round(sec.r) + ',' + Math.round(sec.g) + ',' + Math.round(sec.b));
  st.setProperty('--warn', rgbToHex(sec.r, sec.g, sec.b));
  /* readable foreground on the primary colour */
  const lum = (0.2126 * p.r + 0.7152 * p.g + 0.0722 * p.b) / 255;
  st.setProperty('--on-primary', lum > 0.62 ? '#2B1810' : '#FFF8EE');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', key);
  return true;
}

function AppProvider({ children, catalogVersion = 0 }) {
  const [cart, setCart] = useState(() => storage.read(K.cart, []));
  const [wishlist, setWishlist] = useState(() => storage.read(K.wish, []));
  const [orders, setOrders] = useState(() => storage.read(K.orders, null));
  const [recent, setRecent] = useState(() => storage.read(K.recent, []));
  const [profile, setProfile] = useState(() => storage.read(K.profile, {}));
  const [addresses, setAddresses] = useState(() => storage.read(K.addresses, []));
  const [isAdmin, setIsAdmin] = useState(false);
  const [toasts, setToasts] = useState([]);
  /* signed-in Google account (null = guest, protected actions are locked) */
  const [user, setUser] = useState(() => storage.read(K.user, null));
  const [authOpen, setAuthOpen] = useState(false);
  const [authBusy, setAuthBusy] = useState(false);
  const [authError, setAuthError] = useState('');
  /* product reviews written by signed-in shoppers */
  const [reviews, setReviews] = useState(() => storage.read(K.reviews, []));
  /* store name — editable from admin panel → General section */
  const [siteName, setSiteName] = useState('Rudra');

  useEffect(() => { if (user) storage.write(K.user, user); else storage.remove(K.user); }, [user]);
  useEffect(() => { storage.write(K.cart, cart); }, [cart]);
  useEffect(() => { storage.write(K.wish, wishlist); }, [wishlist]);
  useEffect(() => { if (orders) storage.write(K.orders, orders); }, [orders]);
  useEffect(() => { storage.write(K.recent, recent); }, [recent]);
  useEffect(() => { storage.write(K.profile, profile); }, [profile]);
  useEffect(() => { storage.write(K.addresses, addresses); }, [addresses]);
  useEffect(() => { storage.write(K.reviews, reviews); }, [reviews]);

  /* ---- Firestore: live site name (admin panel → General) ---- */
  useEffect(() => {
    if (!db) return;
    let unsub;
    try {
      unsub = db.collection('settings').doc('general').onSnapshot(snap => {
        const x = snap.exists ? (snap.data() || {}) : {};
        const name = String(x.siteName || '').trim() || 'Rudra';
        setSiteName(prev => (prev === name ? prev : name));
        const tc = String(x.themeColor || '').trim();
        applyThemeColor(/^#[0-9a-fA-F]{6}$/.test(tc) ? tc : DEFAULT_THEME);
      }, () => {});
    } catch (e) { return; }
    return () => { if (unsub) unsub(); };
  }, []);
  useEffect(() => { document.title = siteName + ' — Rudraksha & Locket Store'; }, [siteName]);

  const saveAddress = useCallback(a => {
    setAddresses(prev => {
      const list = (prev || []).slice();
      const rec = Object.assign({}, a, { id: a.id || ('a' + Date.now()) });
      const i = list.findIndex(x => x.id === rec.id);
      if (i > -1) list[i] = rec; else list.push(rec);
      return list;
    });
  }, []);
  const removeAddress = useCallback(id => {
    setAddresses(prev => (prev || []).filter(a => a.id !== id));
  }, []);

  /* ---- delivered orders auto-purge from history after 24 hours ---- */
  useEffect(() => {
    if (!orders || !orders.length) return;
    const now = Date.now();
    const stale = orders.filter(o => o.status === 'Delivered' &&
      (o.deliveredAt ? toMs(o.deliveredAt) : toMs(o.date)) &&
      now - (o.deliveredAt ? toMs(o.deliveredAt) : toMs(o.date)) > DAY_MS);
    if (!stale.length) return;
    const staleIds = stale.map(o => o.id);
    setOrders(prev => (prev || []).filter(o => staleIds.indexOf(o.id) === -1));
    if (db) stale.forEach(o => {
      if (/^(AU|RD)/.test(String(o.id))) db.collection('orders').doc(o.id).delete().catch(() => {});
    });
  }, [orders]);

  /* ---- Firestore: live product reviews (localStorage copy when offline) ---- */
  useEffect(() => {
    if (!db) return;
    let unsub;
    try {
      unsub = db.collection('reviews').limit(500).onSnapshot(snap => {
        const remote = snap.docs.map(d => {
          const x = d.data() || {};
          return {
            id: d.id,
            productId: x.productId || '',
            rating: Number(x.rating) || 5,
            text: x.text || '',
            userName: x.userName || '',
            userPhoto: x.userPhoto || '',
            userKey: x.userKey || '',
            createdAt: Number(x.createdAt) || 0,
            updatedAt: Number(x.updatedAt) || 0
          };
        }).filter(r => r.productId);
        if (remote.length) setReviews(remote);
      }, () => {});
    } catch (e) { return; }
    return () => { if (unsub) unsub(); };
  }, []);

  /* ---- Firestore: register/update this shopper + watch admin flag ---- */
  useEffect(() => {
    if (!db || !profile.email) { setIsAdmin(false); return; }
    const key = String(profile.email).trim().toLowerCase();
    if (!key) { setIsAdmin(false); return; }
    db.collection('users').doc(key).set({
      name: profile.name || '', email: profile.email, phone: profile.phone || '',
      city: profile.city || '',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(() => {});
    let unsub;
    try {
      unsub = db.collection('users').doc(key).onSnapshot(snap => {
        setIsAdmin(!!(snap.exists && snap.data() && snap.data().isAdmin));
      }, () => {});
    } catch (e) { return; }
    return () => { if (unsub) unsub(); };
  }, [profile.email, profile.name, profile.phone, profile.city]);

  /* ---- Firestore: pull live status updates for my orders (shipped/completed/rejected by admin) ---- */
  useEffect(() => {
    if (!db || !profile.email) return;
    const key = String(profile.email).trim().toLowerCase();
    let unsub;
    try {
      unsub = db.collection('orders').where('userKey', '==', key)
        .onSnapshot(snap => {
          const remote = snap.docs.map(d => {
            const o = d.data() || {};            return {
              id: o.id || d.id, date: o.date, status: o.status || 'Processing',
              payment: o.payment || '', total: Number(o.total) || 0,
              items: Array.isArray(o.items) ? o.items : [], address: o.address || '',
              customerName: o.customerName || '', customerEmail: o.customerEmail || '', customerPhone: o.customerPhone || '',
              deliveredAt: o.deliveredAt || null
            };
          });
          if (!remote.length) return;
          setOrders(prev => {
            const byId = {};
            (prev || []).forEach(o => { byId[o.id] = o; });
            let changed = false;
            remote.forEach(r => {
              const cur = byId[r.id];
              if (!cur) { byId[r.id] = r; changed = true; }
              else if (cur.status !== r.status) {
                byId[r.id] = Object.assign({}, cur, {
                  status: r.status,
                  deliveredAt: r.status === 'Delivered' ? (r.deliveredAt || Date.now()) : (cur.deliveredAt || null)
                });
                changed = true;
              }
            });
            if (!changed) return prev;
            return Object.keys(byId).map(k => byId[k]);
          });
        }, () => {});
    } catch (e) { return; }
    return () => { if (unsub) unsub(); };
  }, [profile.email]);

  /* one review per shopper per product — re-posting updates the same record */
  const postReview = useCallback((productId, rating, text) => {
    const key = String((user && user.email) || profile.email || '').trim().toLowerCase();
    if (!key || !productId) return null;
    const now = Date.now();
    let createdAt = now;
    setReviews(prev => {
      const existing = prev.find(r => r.productId === productId && r.userKey === key);
      if (existing && existing.createdAt) createdAt = existing.createdAt;
      return prev.filter(r => !(r.productId === productId && r.userKey === key)).concat([{
        id: productId + '__' + key,
        productId: productId,
        rating: Math.min(5, Math.max(1, Number(rating) || 5)),
        text: String(text || '').trim(),
        userName: profile.name || user.name || 'Shopper',
        userPhoto: profile.photo || user.photo || '',
        userKey: key,
        createdAt: createdAt,
        updatedAt: now
      }]);
    });
    if (db) {
      db.collection('reviews').doc(productId + '__' + key).set({
        productId: productId,
        rating: Math.min(5, Math.max(1, Number(rating) || 5)),
        text: String(text || '').trim(),
        userName: profile.name || user.name || 'Shopper',
        userPhoto: profile.photo || user.photo || '',
        userKey: key,
        createdAt: createdAt,
        updatedAt: now
      }).catch(e => console.warn('review sync failed', e));
    }
    return true;
  }, [user, profile]);

  const toast = useCallback((message, iconName = 'check') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t.slice(-2), { id, message, iconName }]);
    window.setTimeout(() => {
      setToasts(t => t.map(x => (x.id === id ? Object.assign({}, x, { out: true }) : x)));
      window.setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 320);
    }, 2400);
  }, []);

  /* =========================================================
     AUTH — Continue with Google. Uses the real Google popup when
     the provider is enabled in Firebase; otherwise falls back to
     a demo Google account so the flow always completes.
     ========================================================= */
  const applyUser = useCallback((u) => {
    setUser(u);
    setProfile(p => Object.assign({}, p, { name: u.name || '', email: u.email || '', photo: u.photo || '' }));
  }, []);

  /* Firebase error code → simple Hinglish message */
  const googleErrorMessage = (err) => {
    const code = err && err.code;
    if (code === 'auth/popup-blocked') return 'Browser ne Google popup block kiya — popups allow karke dobara try karo.';
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return 'Google sign-in window band ho gayi — dobara try karo.';
    if (code === 'auth/operation-not-allowed') return 'Firebase Console → Authentication → Sign-in method me “Google” provider enable karo.';
    if (code === 'auth/invalid-api-key') return 'Firebase config galat lag rahi hai — firebaseConfig check karo.';
    if (code === 'auth/unauthorized-domain') return 'Ye domain Firebase me authorized nahi hai — Console → Authentication → Authorized domains me add karo.';
    if (code === 'auth/network-request-failed') return 'Network problem — internet check karke dobara try karo.';
    return (err && err.message) || 'Google sign-in fail hua — dobara try karo.';
  };

  /* Continue with Google — real Firebase Auth popup using the config above */
  const signInWithGoogle = useCallback(() => {
    if (authBusy) return;
    if (!auth || !firebase.auth || !firebase.auth.GoogleAuthProvider) {
      setAuthError('Firebase Auth load nahi hua — internet connection check karke page reload karo.');
      return;
    }
    setAuthBusy(true);
    setAuthError('');
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    auth.signInWithPopup(provider).then(res => {
      const u = (res && res.user) || {};
      applyUser({
        uid: u.uid || '', name: u.displayName || 'Google User', email: u.email || '',
        photo: u.photoURL || '', mode: 'google'
      });
      setAuthOpen(false);
      toast('Signed in with Google', 'check');
    }).catch(err => {
      console.warn('Google sign-in failed:', err && err.code, err && err.message);
      /* popup blocked → Firebase-standard fallback: redirect flow */
      if (err && err.code === 'auth/popup-blocked' && auth.signInWithRedirect) {
        return auth.signInWithRedirect(provider).catch(e2 => setAuthError(googleErrorMessage(e2)));
      }
      setAuthError(googleErrorMessage(err));
    }).then(() => { setAuthBusy(false); });
  }, [authBusy, applyUser, toast]);

  /* opens the auth modal for guests; true when already signed in */
  const requireAuth = useCallback(() => {
    if (user) return true;
    setAuthError('');
    setAuthOpen(true);
    return false;
  }, [user]);

  const signOut = useCallback(() => {
    if (auth) { try { auth.signOut(); } catch (e) {} }
    setUser(null);
    setProfile({});
    storage.remove(K.profile);
    toast('Signed out of your account', 'logout');
  }, [toast]);

  /* when Firebase restores an old Google session, re-apply it */
  useEffect(() => {
    if (!auth) return;
    let unsub;
    try {
      unsub = auth.onAuthStateChanged(fbUser => {
        if (fbUser) applyUser({
          uid: fbUser.uid, name: fbUser.displayName || 'Google User',
          email: fbUser.email || '', photo: fbUser.photoURL || '', mode: 'google'
        });
      }, () => {});
    } catch (e) { return; }
    return () => { if (unsub) unsub(); };
  }, [applyUser]);

  /* complete a redirect-based Google sign-in (used when popups are blocked) */
  useEffect(() => {
    if (!auth || !auth.getRedirectResult) return;
    auth.getRedirectResult().then(res => {
      if (res && res.user) {
        const u = res.user;
        applyUser({ uid: u.uid, name: u.displayName || 'Google User', email: u.email || '', photo: u.photoURL || '', mode: 'google' });
        setAuthOpen(false);
        toast('Signed in with Google', 'check');
      }
    }).catch(() => {});
  }, [applyUser, toast]);

  const cartCount = useMemo(() => cart.reduce((s, i) => s + i.qty, 0), [cart]);

  const addToCart = useCallback((product, opts = {}) => {
    const size = opts.size || (product.sizes && product.sizes[0]);
    const color = opts.color || (product.colors && product.colors[0]);
    const qty = opts.qty || 1;
    /* size-wise price: caller may pass opts.price for the chosen size */
    const sp = product.sizePrices && Number(product.sizePrices[size]);
    const price = Number(opts.price) > 0 ? Number(opts.price) : (sp > 0 ? sp : (Number(product.price) || 0));
    const key = product.id + '|' + size + '|' + color;
    setCart(prev => {
      const found = prev.find(i => i.key === key);
      if (found) return prev.map(i => (i.key === key ? Object.assign({}, i, { qty: Math.min(i.qty + qty, 20), price: price }) : i));
      return prev.concat([{ key, id: product.id, size, color, qty, price }]);
    });
    toast('Added to cart successfully!', 'bag');
  }, [toast]);

  const updateQty = useCallback((key, qty) => {
    setCart(prev => qty <= 0 ? prev.filter(i => i.key !== key) : prev.map(i => (i.key === key ? Object.assign({}, i, { qty: Math.min(qty, 20) }) : i)));
  }, []);

  const removeFromCart = useCallback((key) => {
    setCart(prev => prev.filter(i => i.key !== key));
    toast('Product removed from cart', 'trash');
  }, [toast]);

  const clearCart = useCallback(() => setCart([]), []);

  const toggleWish = useCallback((id) => {
    setWishlist(prev => {
      const has = prev.indexOf(id) > -1;
      toast(has ? 'Removed from wishlist' : 'Added to your wishlist', has ? 'trash' : 'heart');
      return has ? prev.filter(x => x !== id) : prev.concat([id]);
    });
  }, [toast]);

  const viewProduct = useCallback((id) => {
    setRecent(prev => [id].concat(prev.filter(x => x !== id)).slice(0, 12));
  }, []);

  const placeOrder = useCallback((payload) => {
    const order = Object.assign({
      id: 'RD' + String(Date.now()).slice(-7),
      date: todayISO(),
      status: 'Processing'
    }, payload);
    setOrders(prev => {
      const base = prev && prev.length ? prev : SAMPLE_ORDERS;
      return [order].concat(base);
    });
    /* push to Firestore so the admin panel receives it live */
    if (db) {
      const userKey = String(profile.email || (payload && payload.customerEmail) || '').trim().toLowerCase();
      db.collection('orders').doc(order.id).set({
        id: order.id, userKey: userKey,
        date: order.date, status: order.status,
        payment: order.payment || '', total: order.total || 0,
        items: order.items || [], address: order.address || '',
        customerName: payload.customerName || profile.name || '',
        customerEmail: payload.customerEmail || profile.email || '',
        customerPhone: payload.customerPhone || profile.phone || '',
        geo: payload.geo || null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(e => console.warn('order sync failed', e));
    }
    return order;
  }, [profile]);

  const cartLines = useMemo(() => cart.map(line => {
    const p = PRODUCT_MAP[line.id];
    const unit = Number(line.price) > 0 ? Number(line.price) : (p ? p.price : 0);
    return Object.assign({}, line, { product: p, unitPrice: unit, lineTotal: p ? unit * line.qty : 0 });
  }).filter(l => l.product), [cart, catalogVersion]);

  const subtotal = useMemo(() => cartLines.reduce((s, l) => s + l.lineTotal, 0), [cartLines]);
  const savings = useMemo(() => cartLines.reduce((s, l) => s + Math.max(0, l.product.originalPrice - l.unitPrice) * l.qty, 0), [cartLines]);
  const shipping = subtotal === 0 || subtotal >= 150 ? 0 : 9;
  const total = subtotal + shipping;

  const value = {
    cart, cartLines, cartCount, subtotal, shipping, total, savings,
    addToCart, updateQty, removeFromCart, clearCart,
    wishlist, toggleWish,
    orders, placeOrder, setOrders,
    recent, viewProduct,
    profile, setProfile,
    addresses, saveAddress, removeAddress,
    isAdmin, catalogVersion, siteName,
    reviews, postReview,
    toasts, toast,
    user, requireAuth, signInWithGoogle, signOut, authOpen, setAuthOpen, authBusy, authError
  };
  return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
}

/* =========================================================
   HOOKS
   ========================================================= */
function useMediaQuery(query) {
  const [matches, setMatches] = useState(() => window.matchMedia ? window.matchMedia(query).matches : false);
  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia(query);
    const handler = e => setMatches(e.matches);
    setMatches(mq.matches);
    mq.addEventListener ? mq.addEventListener('change', handler) : mq.addListener(handler);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', handler) : mq.removeListener(handler); };
  }, [query]);
  return matches;
}

function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const root = ref.current;
    if (!root) return;
    const seen = new WeakSet();
    const supported = 'IntersectionObserver' in window;
    const io = supported ? new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }
      });
    }, { threshold: 0.06, rootMargin: '0px 0px -30px 0px' }) : null;

    const scan = () => {
      const els = Array.prototype.slice.call(root.querySelectorAll('.reveal:not(.in)'));
      els.forEach((el, i) => {
        if (seen.has(el)) return;
        seen.add(el);
        if (!el.style.transitionDelay) el.style.transitionDelay = Math.min(i * 45, 300) + 'ms';
        if (io) io.observe(el); else el.classList.add('in');
      });
    };

    scan();
    /* pick up cards that mount later (e.g. after the skeleton loaders) */
    const mo = new MutationObserver(scan);
    mo.observe(root, { childList: true, subtree: true });
    return () => { mo.disconnect(); if (io) io.disconnect(); };
  }, []);
  return ref;
}

function useCountUp(value) {
  const [n, setN] = useState(value);
  const prev = useRef(value);
  useEffect(() => {
    if (prev.current === value) return;
    const from = prev.current, to = value, t0 = performance.now(), dur = 380;
    let raf;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      setN(Math.round(from + (to - from) * eased));
      if (p < 1) raf = requestAnimationFrame(step); else prev.current = value;
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return n;
}

function filterProducts(list, { q = '', cat = 'All Categories', brand = '', sort = 'popular', band = 'any' } = {}) {
  const needle = q.trim().toLowerCase();
  const b = PRICE_BANDS.find(x => x.id === band) || PRICE_BANDS[0];
  let out = list.filter(p => {
    if (cat && cat !== 'All Categories' && p.category !== cat) return false;
    if (brand && p.brand !== brand) return false;
    if (p.price < b.min || p.price > b.max) return false;
    if (!needle) return true;
    return (p.name + ' ' + p.brand + ' ' + p.category + ' ' + p.description).toLowerCase().indexOf(needle) > -1;
  });
  out = out.slice().sort((a, b2) => {
    if (sort === 'low') return a.price - b2.price;
    if (sort === 'high') return b2.price - a.price;
    if (sort === 'rating') return b2.rating - a.rating;
    return b2.popularity - a.popularity;
  });
  return out;
}

    return PRODUCTS.filter(p => (p.name + ' ' + p.brand + ' ' + p.category).toLowerCase().indexOf(needle) > -1).slice(0, 5);
