          <button className="link-more" onClick={() => navigate('search', { cat, brand })}>See All</button>
        </div>
        {loading ? <SkeletonGrid count={6} /> : (
          <ProductGrid products={list.slice(0, 10)} onOpen={navigate.bind(null, 'product', 'id')}
            emptyTitle="No products in this category"
            emptyText="Pick another category to keep exploring."
            action={<button className="btn btn-primary" onClick={() => { setCat('All Categories'); setBrand(''); }}>Show all products</button>} />
        )}
      </section>

      {visibleOffers.length > 0 && (
        <section className="sec reveal">
          <div className="sec-head">
            <h2 className="sec-title">Today's Offers</h2>
            <span className="sec-sub">Tap to explore</span>
          </div>
          <div className="offers-row">
            {visibleOffers.map((o, idx) => (
              <button key={o.id} className="offer-card" style={{ animationDelay: Math.min(idx * 40, 280) + 'ms' }}
                onClick={() => navigate('offer', { id: o.id })}>
                <span className="offer-media">
                  <Img src={o.img} alt="" />
                  <span className="offer-glow" aria-hidden="true" />
                  <span className="offer-badge">{o.productIds.length} deals</span>
                </span>
                <span className="offer-body">
                  <span className="offer-title">{o.title}</span>
                  <span className="offer-sub">{o.sub}</span>
                  <span className="offer-cta">Shop deal <Icon name="arrow" size={12} stroke={2.4} /></span>
                </span>
              </button>
            ))}
          </div>
        </section>
      )}

      {recentProducts.length > 0 && (
        <section className="sec reveal">
          <div className="sec-head"><h2 className="sec-title">Recently Viewed</h2></div>
          <ProductGrid products={recentProducts} onOpen={navigate.bind(null, 'product', 'id')} />
        </section>
      )}
    </div>
  );
}

/* =========================================================
   PRODUCT DETAILS
   ========================================================= */
function StarsBlock({ rating, reviews }) {
  return (
    <div className="row" style={{ gap: 8 }}>
      <StarRating value={rating} size={15} />
      <span className="rev-count">{rating.toFixed(1)} · {reviews} reviews</span>
    </div>
  );
}

function ProductDetails({ product, navigate }) {
  const app = useApp();
  const [imgIndex, setImgIndex] = useState(0);
  const [size, setSize] = useState(product.sizes[0]);
  const [color, setColor] = useState(product.colors[0]);
  const [qty, setQty] = useState(1);
  const wished = app.wishlist.indexOf(product.id) > -1;
  const [justAdded, setJustAdded] = useState(false);
  const [lightbox, setLightbox] = useState(false);

  useEffect(() => { app.viewProduct(product.id); }, [product.id]);
  useEffect(() => {
    if (imgIndex >= product.images.length) setImgIndex(0);
  }, [product.id]);

  /* the thumbnail row always shows EVERY image (main + all colour-wise, deduped);
     picking a colour jumps the main image to that colour's first photo and
     highlights all of its photos in the row */
  const gallery = useMemo(() => {
    const out = [];
    const push = u => { if (u && out.indexOf(u) === -1) out.push(u); };
    (product.images || []).filter(Boolean).forEach(push);
    const cm = product.colorImages || {};
    product.colors.forEach(c => ((cm[c] || []).filter(Boolean)).forEach(push));
    Object.keys(cm).forEach(c => {
      if (product.colors.indexOf(c) === -1) ((cm[c] || []).filter(Boolean)).forEach(push);
    });
    return out;
  }, [product.id]);
  const colourImgs = ((product.colorImages && product.colorImages[color]) || []).filter(Boolean);
  useEffect(() => {
    const idx = colourImgs.length ? gallery.indexOf(colourImgs[0]) : -1;
    setImgIndex(idx > -1 ? idx : 0);
  }, [color, product.id]);
  useEffect(() => {
    if (imgIndex >= gallery.length) setImgIndex(0);
  }, [gallery.length]);

  /* Esc closes the fullscreen image viewer */
  useEffect(() => {
    if (!lightbox) return;
    const onKey = e => { if (e.key === 'Escape') setLightbox(false); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [lightbox]);

  /* clicking a thumbnail also selects the colour that image belongs to */
  const pickImage = idx => {
    setImgIndex(idx);
    const src = gallery[idx];
    if (!src || !product.colorImages) return;
    const match = product.colors.find(c =>
      c !== color && Array.isArray(product.colorImages[c]) && product.colorImages[c].indexOf(src) > -1);
    if (match) setColor(match);
  };

  const related = useMemo(() => PRODUCTS
    .filter(p => p.id !== product.id && (p.category === product.category || p.brand === product.brand))
    .sort((a, b) => (b.popularity - a.popularity)).slice(0, 4), [product.id, app.catalogVersion]);

  const add = () => {
    if (!app.requireAuth()) return;
    app.addToCart(product, { size, color, qty, price: priceNow });
    setJustAdded(true);
    window.setTimeout(() => setJustAdded(false), 1400);
  };

  /* size-wise price: chosen size overrides the base price when set */
  const sp = product.sizePrices && Number(product.sizePrices[size]);
  const priceNow = sp > 0 ? sp : product.price;
  const discount = product.originalPrice > priceNow ? Math.round((1 - priceNow / product.originalPrice) * 100) : 0;

  return (
    <div>
    <div className="pdp">
      <div className="pdp-gallery">
        <div className="card-media" role="button" tabIndex={0} aria-label="Tap to view full image"
          onClick={() => setLightbox(true)}
          onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setLightbox(true); } }}
          style={{ borderRadius: 'var(--r-lg)', boxShadow: 'var(--sh-sm)', position: 'relative', cursor: 'zoom-in' }}>
          <Img src={gallery[imgIndex]} alt={product.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          {discount > 0 && <span className="tag" style={{ top: 12, left: 12, fontSize: '.72rem' }}>-{discount}% OFF</span>}
          <span className="zoom-hint"><Icon name="eye" size={12} stroke={2.2} /> Tap to view</span>
        </div>
        {gallery.length > 0 && (
          <div className="thumbs" role="group" aria-label="Product images">
            {gallery.map((src, i) => {
              const inColour = colourImgs.length > 0 && colourImgs.indexOf(src) > -1;
              return (
                <button key={i} className={'thumb' + (i === imgIndex ? ' on' : (inColour ? ' on-colour' : ''))}
                  aria-label={'View image ' + (i + 1)}
                  aria-pressed={i === imgIndex} onClick={() => pickImage(i)}>
                  <Img src={src} alt="" />
                  {inColour && <span className="thumb-dot" style={{ background: color }} />}
                </button>
              );
            })}
          </div>
        )}
      </div>

      <div className="pdp-info">
        <div>
          <p className="pdp-brand">{product.brand}</p>
          <h1 className="pdp-title">{product.name}</h1>
        </div>
        <div className="pdp-price">
          <span className="price">{money(priceNow)}</span>
          {discount > 0 && (
            <>
              <span className="mr" style={{ fontSize: '.95rem' }}>{money(product.originalPrice)}</span>
              <span className="tag" style={{ position: 'static' }}>Save {discount}%</span>
            </>
          )}
          {sp > 0 && <span className="sec-sub" style={{ fontSize: '.74rem' }}>price for size {size}</span>}
        </div>
        <StarsBlock rating={product.rating} reviews={product.reviews} />
        <p className="desc">{product.description}</p>

        <div>
          <p className="opt-label">Select size <span>{size}</span></p>
          <div className="opt-row" role="group" aria-label="Sizes">
            {product.sizes.map(s => (
              <button key={s} className={'size' + (s === size ? ' on' : '')} aria-pressed={s === size}
                onClick={() => setSize(s)}>{s}</button>
            ))}
          </div>
        </div>

        <div>
          <p className="opt-label">Colour</p>
          <div className="opt-row" role="group" aria-label="Colours">
            {Array.from(new Set(product.colors)).map(c => (
              <button key={c} className={'swatch' + (c === color ? ' on' : '')} style={{ background: c }}
                title={(product.colorNames && product.colorNames[c]) || c}
                aria-label={(product.colorNames && product.colorNames[c]) ? product.colorNames[c] : 'Colour ' + c}
                aria-pressed={c === color} onClick={() => setColor(c)} />
            ))}
          </div>
        </div>

        <div className="row" style={{ gap: 12, flexWrap: 'wrap' }}>
          <p className="opt-label" style={{ margin: 0 }}>Quantity</p>
          <div className="qty">
            <button aria-label="Decrease quantity" onClick={() => setQty(q => Math.max(1, q - 1))} disabled={qty <= 1}>
              <Icon name="minus" size={16} stroke={2.4} />
            </button>
            <span aria-live="polite">{qty}</span>
            <button aria-label="Increase quantity" onClick={() => setQty(q => Math.min(20, q + 1))}>
              <Icon name="plus" size={16} stroke={2.4} />
            </button>
          </div>
        </div>

        <div className="row" style={{ gap: 10, flexWrap: 'wrap' }}>
          <button className="btn btn-primary" style={{ flex: '1 1 190px' }} onClick={add}>
            {justAdded ? <><Icon name="check" size={17} stroke={2.4} /> Added to cart</> : <><Icon name="bag" size={17} /> Add to Cart</>}
          </button>
          <button className="btn btn-dark" style={{ flex: '1 1 150px' }}
            onClick={() => { if (!app.requireAuth()) return; app.addToCart(product, { size, color, qty, price: priceNow }); navigate('checkout'); }}>
            Buy Now
          </button>
          <button className={'icon-btn' + (wished ? ' on' : '')} style={{ width: 52, height: 52, borderRadius: 999, flex: 'none' }}
            aria-label={wished ? 'Remove from wishlist' : 'Add to wishlist'} aria-pressed={wished}
            onClick={() => { if (!app.requireAuth()) return; app.toggleWish(product.id); }}>
            <Icon name="heart" size={21} stroke={wished ? 0 : 1.8}
              style={{ color: wished ? '#2B1810' : 'rgba(43,24,16,.55)', fill: wished ? 'var(--primary)' : 'none' }} />
          </button>
        </div>

        <ul className="card-p" style={{ display: 'flex', flexDirection: 'column', gap: 10, fontSize: '.82rem', color: '#2B1810' }}>
          <li className="row" style={{ gap: 10 }}><Icon name="truck" size={17} style={{ color: 'var(--accent)' }} /> Free delivery on orders over \u20B9150 \u00B7 7-day easy returns (demo)</li>
          <li className="row" style={{ gap: 10 }}><Icon name="shield" size={17} style={{ color: 'var(--accent)' }} /> Secure demo checkout — no real payments are processed</li>
          <li className="row" style={{ gap: 10 }}><Icon name="tag" size={17} style={{ color: 'var(--accent)' }} /> SKU {product.id.toUpperCase()} · {product.category}</li>
        </ul>
      </div>      </div>

      {lightbox && (
        <div className="scrim lb" role="dialog" aria-modal="true" aria-label="Product image viewer"
          onClick={() => setLightbox(false)}>
          <div className="lb-stage" onClick={e => e.stopPropagation()}>
            <Img src={gallery[imgIndex]} alt={product.name}
              style={{ maxWidth: 'min(920px, 92vw)', maxHeight: '74vh', objectFit: 'contain', borderRadius: 14, boxShadow: '0 30px 80px rgba(43,24,16,.5)' }} />
            <div className="lb-bar">
              {gallery.length > 1 && (
                <button className="lb-btn" aria-label="Previous image"
                  onClick={() => setImgIndex(i => (i - 1 + gallery.length) % gallery.length)}>
                  <Icon name="left" size={20} />
                </button>
              )}
              <span className="lb-count">{imgIndex + 1} / {gallery.length}</span>
              {gallery.length > 1 && (
                <button className="lb-btn" aria-label="Next image"
                  onClick={() => setImgIndex(i => (i + 1) % gallery.length)}>
                  <Icon name="right" size={20} />
                </button>
              )}
              <button className="lb-btn" aria-label="Close image viewer" onClick={() => setLightbox(false)}>
                <Icon name="close" size={19} />
              </button>
            </div>
          </div>
        </div>
      )}

    <ReviewsSection product={product} />
    <section className="sec reveal" style={{ marginTop: 30 }}>
      <div className="sec-head">
        <h2 className="sec-title">You may also like</h2>
        <span className="spacer" />
        <button className="link-more" onClick={() => navigate('search', { cat: product.category })}>See All</button>
      </div>
      <ProductGrid products={related} onOpen={navigate.bind(null, 'product', 'id')} />
    </section>
    </div>
  );
}

/* =========================================================
   CUSTOMER REVIEWS — signed-in shoppers post, everyone reads.
   Shown directly under the product. Syncs to Firestore `reviews`.
   ========================================================= */
function fmtReviewDate(ts) {
  if (!ts) return '';
  try {
    return new Date(ts).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  } catch (e) { return ''; }
}

function ReviewsSection({ product }) {
  const app = useApp();
  const userKey = String((app.user && app.user.email) || '').trim().toLowerCase();
  const list = useMemo(() => app.reviews
    .filter(r => r.productId === product.id)
    .sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0)),
    [app.reviews, product.id]);
  const mine = userKey ? (list.find(r => r.userKey === userKey) || null) : null;
  const [rating, setRating] = useState(mine ? mine.rating : 5);
  const [text, setText] = useState(mine ? mine.text : '');
  const [error, setError] = useState('');
  const mineStamp = mine ? mine.updatedAt : 0;

  useEffect(() => {
    if (mine) { setRating(mine.rating); setText(mine.text); }
  }, [mineStamp]);

  const avg = list.length ? list.reduce((s, r) => s + (Number(r.rating) || 5), 0) / list.length : 0;
  const signedIn = !!app.user;

  const submit = e => {
    e.preventDefault();
    if (!app.requireAuth()) return;
    const body = String(text || '').trim();
    if (body.length < 3) { setError('Review thoda likho — kam se kam 3 characters.'); return; }
    if (body.length > 600) { setError('Review 600 characters se chhota rakho.'); return; }
    setError('');
    app.postReview(product.id, rating, body);
    app.toast(mine ? 'Aapka review update ho gaya' : 'Review post ho gaya — shukriya!', 'check');
  };

  return (
    <section className="rev" aria-label="Customer reviews">
      <div className="rev-head">
        <h2 className="sec-title">Customer Reviews</h2>
        <span className="rev-pill">
          <Icon name="star" size={13} style={{ fill: 'currentColor' }} />
          {list.length ? avg.toFixed(1) : '—'}
        </span>
        <span className="spacer" />
        <span className="sec-sub">{list.length} review{list.length === 1 ? '' : 's'}</span>
      </div>

      {!signedIn && (
        <div className="rev-gate">
          <p>Review likhne ke liye apne Google account se sign in karo — aapka naam aur rating product ke neeche dikhenge.</p>
          <button className="btn btn-primary" style={{ height: 44 }} onClick={() => app.requireAuth()}>
            <Icon name="user" size={16} /> Login to write a review
          </button>
        </div>
      )}

      {signedIn && (
        <form className="rev-form" onSubmit={submit}>
          <p className="rev-label">{mine ? 'Apna review update karo' : 'Yeh product kaisa laga?'}</p>
          <div className="rev-pick" role="group" aria-label="Your rating">
            {[1, 2, 3, 4, 5].map(i => (
              <button key={i} type="button" aria-label={i + ' star' + (i === 1 ? '' : 's')}
                aria-pressed={i === rating} onClick={() => setRating(i)}>
                <Icon name="star" size={22} stroke={1.6}
                  style={{ color: '#2B1810', fill: i <= rating ? 'var(--secondary)' : 'none' }} />
              </button>
            ))}
            <span className="sec-sub" style={{ marginLeft: 6 }}>{rating} / 5</span>
          </div>
          <textarea value={text} maxLength={600} aria-label="Your review"
            placeholder="Apna experience share karo — fit, quality, delivery…"
            onChange={e => setText(e.target.value)} />
          {error && <span className="err-msg" role="alert">{error}</span>}
          <div className="rev-actions">
            <button className="btn btn-primary" style={{ height: 44, flex: '1 1 170px' }} type="submit">
              <Icon name={mine ? 'edit' : 'check'} size={16} /> {mine ? 'Update review' : 'Post review'}
            </button>
            <span className="sec-sub">{String(text || '').trim().length}/600</span>
          </div>
        </form>
      )}

      {list.length === 0 ? (
        <p className="rev-empty">Abhi tak koi review nahi hai — pehla review aap likho.</p>
      ) : list.map(r => (
        <article className="rev-item" key={r.id || (r.productId + '|' + r.userKey)}>
          <span className="rev-ava">
            {r.userPhoto ? <img src={r.userPhoto} alt="" loading="lazy" /> : String(r.userName || 'S').charAt(0).toUpperCase()}
          </span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="row" style={{ gap: 8, flexWrap: 'wrap' }}>
              <span className="rev-name">{r.userName || 'Shopper'}</span>
              {userKey && r.userKey === userKey && <span className="rev-you">You</span>}
              <span className="spacer" />
              <span className="rev-meta">{fmtReviewDate(r.createdAt)}</span>
            </div>
            <StarRating value={Number(r.rating) || 5} size={13} />
            <p className="rev-text">{r.text}</p>
          </div>
        </article>
      ))}
    </section>
  );
}

/* =========================================================
   CART
   ========================================================= */
function FreeShipNote({ subtotal }) {
  const goal = 150;
  const pct = Math.min(100, Math.round((subtotal / goal) * 100));
  const left = Math.max(0, goal - subtotal);
  return (
    <div className="card-p" style={{ marginBottom: 14 }}>
      {left > 0 ? (
        <p style={{ fontSize: '.82rem', color: '#2B1810' }}>Add <strong style={{ color: 'var(--accent)' }}>{money(left)}</strong> more for free delivery</p>
      ) : (
        <p className="row" style={{ gap: 8, fontSize: '.84rem', fontWeight: 700, color: 'var(--ok)' }}>
          <Icon name="check" size={16} stroke={2.4} /> You have unlocked free delivery
        </p>
      )}
      <div className="progress"><i style={{ width: pct + '%' }} /></div>
    </div>
  );
}

function OrderSummary({ subtotal, shipping, total, savings, children, footer, title = 'Order Summary' }) {
  return (
    <div className="summary">
      <h3 style={{ fontSize: '1rem', fontWeight: 800, marginBottom: 6 }}>{title}</h3>
      {children}
      <div className="sum-row"><span>Subtotal</span><span>{money(subtotal)}</span></div>
      {savings > 0 && <div className="sum-row" style={{ color: 'var(--ok)' }}><span>You saved</span><span>-{money(savings)}</span></div>}
      <div className="sum-row"><span>Delivery charge</span><span>{shipping === 0 ? <b style={{ color: 'var(--ok)' }}>Free</b> : money(shipping)}</span></div>
      <div className="sum-row"><span>Taxes (demo)</span><span>Included</span></div>
      <div className="sum-total"><span>Total</span><span>{money(total)}</span></div>
      {footer}
    </div>
  );
}

function CartPage({ navigate }) {
  const app = useApp();
  const { cartLines, subtotal, shipping, total, savings } = app;

  if (!cartLines.length) {
    return (
      <div className="empty">
        <div className="empty-art"><Icon name="bag" size={40} stroke={1.4} /></div>
        <h3>Your bag is empty</h3>
        <p>Looks like you have not added anything yet. Explore the new season and find something you love.</p>
        <button className="btn btn-primary" onClick={() => navigate('home')}>Start shopping</button>
      </div>
    );
  }

  return (
    <div className="split">
      <div>
        <FreeShipNote subtotal={subtotal} />
        <div className="stack" style={{ gap: 12 }}>
          {cartLines.map((line, i) => (
            <div className="line-item" key={line.key} style={{ animationDelay: Math.min(i * 55, 300) + 'ms' }}>
              <button onClick={() => navigate('product', { id: line.id })} aria-label={'View ' + line.product.name} style={{ flex: 'none' }}>
                <Img src={line.product.images[0]} alt={line.product.name} />
              </button>
              <div className="li-body">
                <div className="row" style={{ gap: 8 }}>
                  <h3 className="li-name" style={{ flex: 1 }}>{line.product.name}</h3>
                  <span className="price" style={{ fontSize: '.95rem' }}>{money(line.lineTotal)}</span>
                </div>
                <p className="li-meta">{line.product.brand} · Size {line.size} · <span style={{ display: 'inline-block', width: 9, height: 9, borderRadius: 3, background: line.color, verticalAlign: 'middle', boxShadow: '0 0 0 1px rgba(43,24,16,.12)' }} /></p>
                <div className="li-foot">
                  <div className="qty-sm">
                    <button aria-label={'Decrease quantity of ' + line.product.name} onClick={() => app.updateQty(line.key, line.qty - 1)}>
                      <Icon name="minus" size={14} stroke={2.4} />
                    </button>
                    <span>{line.qty}</span>
                    <button aria-label={'Increase quantity of ' + line.product.name} onClick={() => app.updateQty(line.key, line.qty + 1)}>
                      <Icon name="plus" size={14} stroke={2.4} />
                    </button>
                  </div>
                  <button className="rm" aria-label={'Remove ' + line.product.name} onClick={() => app.removeFromCart(line.key)}>
                    <Icon name="trash" size={16} />
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <OrderSummary subtotal={subtotal} shipping={shipping} total={total} savings={savings}
        footer={<div className="stack" style={{ gap: 10, marginTop: 16 }}>
          <button className="btn btn-primary btn-block" onClick={() => { if (!app.requireAuth()) return; navigate('checkout'); }}>
            Proceed to Checkout <Icon name="arrow" size={16} stroke={2.2} />
          </button>
          <button className="btn btn-ghost btn-block" onClick={() => navigate('home')}>Continue Shopping</button>
        </div>} />
    </div>
  );
}

/* =========================================================
   WISHLIST
   ========================================================= */
function WishlistPage({ navigate }) {
  const app = useApp();
  const items = app.wishlist.map(id => PRODUCT_MAP[id]).filter(Boolean);

  if (!items.length) {
    return (
      <div className="empty">
        <div className="empty-art"><Icon name="heart" size={40} stroke={1.4} /></div>
        <h3>Your wishlist is empty</h3>
        <p>Tap the heart on any product to save it here for later. Your picks stay on this device.</p>
        <button className="btn btn-primary" onClick={() => navigate('home')}>Browse products</button>
      </div>
    );
  }

  const totalSaved = items.reduce((s, p) => s + (p.originalPrice - p.price), 0);

  return (
    <div>
      <div className="free-pill" style={{ marginBottom: 14 }}>
        <Icon name="tag" size={14} /> {items.length} saved · you save {money(totalSaved)} vs list price
      </div>
      <ProductGrid products={items} onOpen={navigate.bind(null, 'product', 'id')} />
      <div className="stack" style={{ gap: 10, marginTop: 20 }}>
        <button className="btn btn-primary btn-block" onClick={() => {
          items.forEach(p => app.addToCart(p));
          navigate('cart');
        }}>
          Move all to Cart <Icon name="arrow" size={16} stroke={2.2} />
        </button>
        <button className="btn btn-ghost btn-block" onClick={() => navigate('home')}>Continue Shopping</button>
      </div>
    </div>
  );
}

/* =========================================================
   SEARCH / FILTER
   ========================================================= */
function SearchPage({ navigate, params }) {
  const app = useApp();
  const [q, setQ] = useState(params.q || '');
  const [cat, setCat] = useState(params.cat || 'All Categories');
  const [brand, setBrand] = useState(params.brand || '');
  const [sort, setSort] = useState('popular');
  const [band, setBand] = useState('any');

  const results = useMemo(
    () => filterProducts(PRODUCTS, { q, cat, brand, sort, band }),
    [q, cat, brand, sort, band, app.catalogVersion]
  );
  const activeFilters = (cat !== 'All Categories' ? 1 : 0) + (brand ? 1 : 0) + (band !== 'any' ? 1 : 0) + (q ? 1 : 0);

  const reset = () => { setQ(''); setCat('All Categories'); setBrand(''); setBand('any'); setSort('popular'); };

  return (
    <div>
      <SearchBar initial={q} onSubmit={setQ} onChangeValue={setQ}
        onOpen={(val, id) => id ? navigate('product', { id }) : setQ(val || '')} />

      <div className="chips reveal" aria-label="Filter by category">
        {CATEGORIES.map(c => (
          <button key={c} className={'chip mini' + (cat === c ? ' active' : '')} aria-pressed={cat === c} onClick={() => setCat(c)}>{c}</button>
        ))}
      </div>

      <div className="card-p reveal" style={{ marginTop: 12, display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div className="row" style={{ gap: 10, flexWrap: 'wrap' }}>
          <span className="row" style={{ gap: 6, fontSize: '.78rem', fontWeight: 700, color: '#2B1810' }}>
            <Icon name="filter" size={15} /> Price
          </span>
          <div className="row" style={{ gap: 7, flexWrap: 'wrap' }}>
            {PRICE_BANDS.map(b => (
              <button key={b.id} className={'chip mini' + (band === b.id ? ' active' : '')} aria-pressed={band === b.id}
                onClick={() => setBand(b.id)}>{b.label}</button>
            ))}
          </div>
        </div>
        <div className="row" style={{ gap: 10, flexWrap: 'wrap' }}>
          <span className="row" style={{ gap: 6, fontSize: '.78rem', fontWeight: 700, color: '#2B1810' }}>
            <Icon name="tag" size={15} /> Brand
          </span>
          <div className="row" style={{ gap: 7, flexWrap: 'wrap' }}>
            {BRANDS.map(b => (
              <button key={b.id} className={'chip mini' + (brand === BRAND_NAME[b.id] ? ' active' : '')}
                aria-pressed={brand === BRAND_NAME[b.id]} onClick={() => setBrand(brand === b.name ? '' : b.name)}>
                {b.name}
              </button>
            ))}
          </div>
        </div>
        <div className="row" style={{ gap: 10, flexWrap: 'wrap' }}>
          <label htmlFor="sort" className="row" style={{ gap: 6, fontSize: '.78rem', fontWeight: 700, color: '#2B1810' }}>
            <Icon name="sliders" size={15} /> Sort
          </label>
          <select id="sort" className="input" style={{ width: 'auto', minWidth: 190, height: 42, borderRadius: 999, padding: '0 14px' }}
            value={sort} onChange={e => setSort(e.target.value)}>
            {SORTS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
          {activeFilters > 0 && (
            <button className="chip mini" onClick={reset} style={{ marginLeft: 'auto' }}>
              <Icon name="refresh" size={13} stroke={2.2} /> Clear all
            </button>
          )}
        </div>
      </div>

      <div className="sec-head" style={{ marginTop: 18 }}>
        <h2 className="sec-title" style={{ fontSize: '.98rem' }}>{results.length} result{results.length === 1 ? '' : 's'}</h2>
        {q && <span className="sec-sub">for “{q}”</span>}
      </div>

      <ProductGrid products={results} onOpen={navigate.bind(null, 'product', 'id')}
        emptyTitle="No products found"
        emptyText="We could not find anything matching those filters. Try a broader search or clear your filters."
        action={<button className="btn btn-primary" onClick={reset}>Clear filters</button>} />
    </div>
  );
}

/* =========================================================
   COLLECTIONS
   ========================================================= */
function CollectionsPage({ navigate, params }) {
  const app = useApp();
  const [sel, setSel] = useState((params && params.id) || null);
  const collection = COLLECTIONS.find(c => c.id === sel) || null;

  const list = useMemo(() => {
    if (!collection) return PRODUCTS.slice().sort((a, b) => b.popularity - a.popularity).slice(0, 8);
    return PRODUCTS.filter(p => p.collection.indexOf(collection.id) > -1);
  }, [collection, app.catalogVersion]);

  return (
    <div>
      <section className="sec reveal" style={{ marginTop: 12 }}>
        <div className="sec-head">
          <h2 className="sec-title">{collection ? collection.name : 'Trending now'}</h2>
          <span className="sec-sub">{list.length} items</span>
          <span className="spacer" />
          {collection && <button className="link-more" onClick={() => setSel(null)}>See all</button>}
        </div>
        {list.length
          ? <ProductGrid products={list} onOpen={navigate.bind(null, 'product', 'id')} />
          : (
            <div className="empty">
              <div className="empty-art"><Icon name="layers" size={38} stroke={1.5} /></div>
              <h3>Nothing here yet</h3>
              <p>This collection is being styled. Check back soon or explore trending products.</p>
              <button className="btn btn-primary" onClick={() => setSel(null)}>Show trending</button>
            </div>
          )}
      </section>
    </div>
  );
}

/* =========================================================
   OFFER PAGE — products belonging to one offer
   ========================================================= */
function OfferPage({ navigate, params }) {
  const app = useApp();
  const offer = OFFERS.find(o => o.id === (params && params.id)) || null;
  const list = useMemo(() => {
    if (!offer) return [];
    return offer.productIds.map(id => PRODUCT_MAP[id]).filter(Boolean);
  }, [offer && offer.id, app.catalogVersion]);

  if (!offer) {
    return (
      <div className="empty">
        <div className="empty-art"><Icon name="tag" size={38} stroke={1.5} /></div>
        <h3>Offer not found</h3>
        <p>This offer may have ended or been removed by the store.</p>
        <button className="btn btn-primary" onClick={() => navigate('home')}>Back to home</button>
      </div>
    );
  }

  return (
    <div>
      <div className="offer-hero reveal">
        {offer.img && <Img src={offer.img} alt="" />}
        <div className="offer-hero-body">
          <h2>{offer.title}</h2>
          {offer.sub && <p>{offer.sub}</p>}
        </div>
      </div>
      <section className="sec reveal">
        <div className="sec-head">
          <h2 className="sec-title">{list.length} deal{list.length === 1 ? '' : 's'} in this offer</h2>
          <span className="spacer" />
          <button className="link-more" onClick={() => navigate('home')}>Back home</button>
        </div>
        {list.length
          ? <ProductGrid products={list} onOpen={navigate.bind(null, 'product', 'id')} />
          : (
            <div className="empty">
              <div className="empty-art"><Icon name="box" size={38} stroke={1.5} /></div>
              <h3>No products in this offer yet</h3>
              <p>The store admin can add products to this offer from the admin panel.</p>
              <button className="btn btn-primary" onClick={() => navigate('home')}>Browse everything</button>

}

];

        <div className="free-pill reveal" style={{ alignSelf: 'flex-start' }}>
          <Icon name="shield" size={14} /> {app.user && app.user.mode === 'demo' ? 'Signed in — demo Google account' : 'Signed in with Google'}

        <div className="row reveal" style={{ gap: 10 }}>
          <div className="card-p" style={{ flex: 1, textAlign: 'center' }}>

          <div className="card-p" style={{ flex: 1, textAlign: 'center' }}>

          </>}>
          <p>Cart, wishlist aur orders aapke account se linked hain — wapas aane par Google se sign-in kar sab wapas mil jayega. Saved addresses is device par rehte hain.</p>
        </Modal>
      )}
      {modal === 'addresses' && (
        <Modal title="Shopping addresses" onClose={() => { setModal(null); setAddrDraft(null); }}>

              <div className="field">
                <label htmlFor="ad-name">Location name *</label>

              </div>

                  state: loc.state || (d && d.state) || '',

                <label htmlFor="ad-addr">Address</label>

              <div className="form-2" style={{ marginTop: 12 }}>
                <div className="field">
                  <label htmlFor="ad-city">City</label>
                  <input id="ad-city" className="input" value={addrDraft.city}

                  <label htmlFor="ad-state">State</label>

                    app.saveAddress(addrDraft);
                    app.toast('Address \u201C' + addrDraft.label + '\u201D saved', 'pin');
                    setAddrDraft(null);
                  }}>Save address</button>
                <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setAddrDraft(null)}>Cancel</button>

                </p>
              </details>
            ))}
          </div>
        </Modal>
      )}
    </div>
  );
}

/* =========================================================
   ORDERS
   ========================================================= */
const STATUS_CLASS = { Processing: 'st-processing', Shipped: 'st-shipped', Delivered: 'st-delivered', Cancelled: 'st-cancelled' };

function OrdersPage({ navigate, onBack }) {
  const app = useApp();
  const orders = app.orders && app.orders.length ? app.orders : SAMPLE_ORDERS;
  const [detail, setDetail] = useState(null);
  const fmt = iso => new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

  return (
    <div className="wrap">
      <div className="stack" style={{ gap: 12 }}>
        {orders.map((o, i) => (
          <div className="order reveal" key={o.id} style={{ transitionDelay: Math.min(i * 60, 300) + 'ms' }}>
            <div className="order-top">
              <span className="order-id">Order #{o.id}</span>
              <span className={'status ' + (STATUS_CLASS[o.status] || 'st-processing')}>{o.status}</span>
            </div>
            <div className="order-thumbs">
              {o.items.map((it, k) => {
                const p = PRODUCT_MAP[it.id];
                return p ? <Img key={k} src={p.images[0]} alt={p.name} /> : null;
              })}
            </div>
            <div className="order-foot">
              <span className="row" style={{ gap: 5 }}><Icon name="refresh" size={13} /> {fmt(o.date)}</span>
              <span className="row" style={{ gap: 5 }}><Icon name="bag" size={13} /> {o.items.reduce((s, x) => s + x.qty, 0)} item(s)</span>
              <span className="row" style={{ gap: 5 }}><Icon name="wallet" size={13} /> {o.payment}</span>
              <span className="spacer" />
              <span className="price" style={{ fontSize: '.95rem' }}>{money(o.total)}</span>
            </div>
            <div className="row" style={{ gap: 10 }}>
              <button className="btn btn-ghost" style={{ flex: 1, height: 44 }} onClick={() => setDetail(o)}>View Details</button>
              <button className="btn btn-dark" style={{ flex: 1, height: 44 }}
                onClick={() => { o.items.forEach(it => { const p = PRODUCT_MAP[it.id]; if (p) app.addToCart(p, { size: it.size, color: it.color, qty: it.qty, price: it.price }); }); navigate('cart'); }}>
                Reorder
              </button>
            </div>
          </div>
        ))}
      </div>

      {detail && (
        <Modal title={'Order #' + detail.id} onClose={() => setDetail(null)}>
          <div className="stack" style={{ gap: 10, marginTop: 8 }}>
            <div className="row">
              <span className={'status ' + (STATUS_CLASS[detail.status] || 'st-processing')}>{detail.status}</span>
              <span className="spacer" />
              <span style={{ fontSize: '.8rem', color: 'var(--muted)' }}>{fmt(detail.date)}</span>
            </div>
            {detail.items.map((it, k) => {
              const p = PRODUCT_MAP[it.id];
              if (!p) return null;
              return (
                <div className="line-item" key={k} style={{ animation: 'none' }}>
                  <Img src={p.images[0]} alt={p.name} />
                  <div className="li-body">
                    <h3 className="li-name">{p.name}</h3>
                    <p className="li-meta">Size {it.size} · Qty {it.qty} · {p.brand}</p>
                    <div className="li-foot"><span className="price" style={{ fontSize: '.9rem' }}>{money((Number(it.price) > 0 ? Number(it.price) : p.price) * it.qty)}</span></div>
                  </div>
                </div>
              );
            })}
            <div className="sum-row"><span>Payment</span><span>{detail.payment}</span></div>
            {detail.address && <div className="sum-row"><span>Deliver to</span><span style={{ textAlign: 'right', maxWidth: 220 }}>{detail.address}</span></div>}
            <div className="sum-total"><span>Total</span><span>{money(detail.total)}</span></div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---- satellite location map: fetch current location, zoom locked ---- */
function LocationMap({ onPick }) {
  const boxRef = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);
  const pickRef = useRef(onPick);
  pickRef.current = onPick;
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState('');

  const dropPin = (lat, lng) => {
    const map = mapRef.current;
    if (!map || typeof L === 'undefined') return;
    if (markerRef.current) markerRef.current.setLatLng([lat, lng]);
    else markerRef.current = L.circleMarker([lat, lng], {
      radius: 8, color: '#fff', weight: 3, fillColor: 'var(--primary)', fillOpacity: 1
    }).addTo(map);
    map.setView([lat, lng], Math.max(map.getZoom(), 16));
    setStatus('Location locked — fetching address…');
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng)
      .then(r => r.json())
      .then(d => {
        const a = (d && d.address) || {};
        const road = a.road || a.pedestrian || a.neighbourhood || a.suburb || a.quarter || '';
        const house = a.house_number || '';
        pickRef.current({
          lat: lat, lng: lng,
          address: (house + ' ' + road).trim() || (d && d.display_name) || (lat.toFixed(5) + ', ' + lng.toFixed(5)),
          city: a.city || a.town || a.village || '',
          state: a.state || '',
          zip: a.postcode || ''
        });
        setStatus('Address filled from map ✓ — edit if needed');
      })
      .catch(() => {
        pickRef.current({
          lat: lat, lng: lng,
          address: lat.toFixed(5) + ', ' + lng.toFixed(5), city: '', state: '', zip: ''
        });
        setStatus('Pin set — reverse lookup failed, please type the address');
      });
  };

  const locate = () => {
    if (!navigator.geolocation) { setStatus('Geolocation is not supported by this browser'); return; }
    setBusy(true); setStatus('Fetching your current location…');
    navigator.geolocation.getCurrentPosition(pos => {
      setBusy(false);
      setStatus('Location found');
      dropPin(pos.coords.latitude, pos.coords.longitude);
    }, err => {
      setBusy(false);
      setStatus('Could not get location: ' + (err && err.message || 'denied') + ' — tap the map instead');
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  };

  useEffect(() => {
    if (!boxRef.current || mapRef.current) return;
    if (typeof L === 'undefined') { setStatus('Map library failed to load — type the address manually'); return; }
    const map = L.map(boxRef.current, {
      center: [20.59, 78.96], zoom: 5,
      zoomControl: false, attributionControl: true,
      scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false,
      boxZoom: false, keyboard: false, dragging: true
    });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics'
    }).addTo(map);
    map.on('click', e => dropPin(e.latlng.lat, e.latlng.lng));
    mapRef.current = map;
    const t = window.setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 250);
    return () => {
      window.clearTimeout(t);
      try { map.remove(); } catch (e) {}
      mapRef.current = null; markerRef.current = null;
    };
  }, []);

  return (
    <div>
      <div className="row" style={{ gap: 10, flexWrap: 'wrap' }}>
        <button type="button" className="btn btn-primary" style={{ height: 44 }} onClick={locate} disabled={busy}>
          <Icon name="pin" size={16} /> {busy ? 'Locating…' : 'Use my current location'}
        </button>
        <span className="sec-sub" style={{ fontSize: '.76rem' }}>{status || 'Satellite view · zoom locked — tap the map to drop a pin'}</span>
      </div>
      <div className="loc-map" ref={boxRef} role="application" aria-label="Satellite location map (zoom disabled)">
        {typeof L === 'undefined' && <span className="loc-pin">Map unavailable</span>}
      </div>
      <p className="hint" style={{ fontSize: '.72rem', color: 'var(--muted)', marginTop: 7 }}>
        Current location se address auto-fill hota hai — chaaho to niche manually edit kar sakte ho.
      </p>
    </div>
  );
}

function CheckoutPage({ navigate, onBack, onPlaced }) {
  const app = useApp();
  const { cartLines, subtotal, shipping, total, savings } = app;
  const [form, setForm] = useState({
    name: app.profile.name || '', phone: app.profile.phone || '', email: app.profile.email || '',
    address: '', city: app.profile.city || '', state: '', zip: ''
  });
  const [errors, setErrors] = useState({});
  const [payment, setPayment] = useState('cod');
  const [placing, setPlacing] = useState(false);
  const [geo, setGeo] = useState(null);

  if (!cartLines.length && !placing) {
    return (
      <div className="empty">
        <div className="empty-art"><Icon name="box" size={38} stroke={1.5} /></div>
        <h3>Nothing to check out</h3>
        <p>Add a few pieces to your bag first, then come back to place your demo order.</p>
        <button className="btn btn-primary" onClick={() => navigate('home')}>Browse products</button>
      </div>
    );
  }

  const set = (k, v) => { setForm(f => Object.assign({}, f, { [k]: v })); setErrors(e => Object.assign({}, e, { [k]: null })); };

  const validate = () => {
    const errs = {};
    ADDRESS_FIELDS.forEach(f => {
      const v = (form[f.key] || '').trim();
      if (!v) errs[f.key] = f.label + ' is required';
      else if (f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) errs[f.key] = 'Enter a valid email address';
      else if (f.key === 'phone' && v.replace(/\D/g, '').length < 7) errs[f.key] = 'Enter a valid phone number';
    });
    if (!cartLines.length) errs.cart = 'Your bag is empty';
    setErrors(errs);
    return Object.keys(errs).length === 0;
  };

  const submit = e => {
    e.preventDefault();
    if (!validate()) {
      app.toast('Please check the highlighted fields', 'help');
      return;
    }
    setPlacing(true);
    window.setTimeout(() => {
      const order = app.placeOrder({
        items: cartLines.map(l => ({
          id: l.id, name: l.product.name, image: (l.product.images && l.product.images[0]) || '',
          qty: l.qty, size: l.size, color: l.color, price: l.unitPrice
        })),
        total,
        payment: (PAYMENTS.find(p => p.id === payment) || {}).name,
        address: form.address + ', ' + form.city + ', ' + form.state + ' ' + form.zip,
        customerName: form.name,
        customerEmail: form.email,
        customerPhone: form.phone,
        geo: geo
      });
      app.clearCart();
      onPlaced(order);
    }, 900);
  };

  return (
    <form className="split" onSubmit={submit} noValidate>
      <div className="stack" style={{ gap: 18 }}>
        <section className="card-p reveal">
          <h2 className="sec-title" style={{ fontSize: '.98rem', marginBottom: 4 }}>Contact details</h2>
          <p className="sec-sub" style={{ marginBottom: 12 }}>Demo checkout — please use any details.</p>
          <div className="form-2">
            <div className="field">
              <label htmlFor="ck-name">Full name</label>
              <input id="ck-name" className={'input' + (errors.name ? ' err' : '')} value={form.name} autoComplete="name"
                onChange={e => set('name', e.target.value)} aria-invalid={!!errors.name} />
              {errors.name && <span className="err-msg">{errors.name}</span>}
            </div>
            <div className="field">
              <label htmlFor="ck-phone">Phone</label>
              <input id="ck-phone" type="tel" className={'input' + (errors.phone ? ' err' : '')} value={form.phone} autoComplete="tel"
                onChange={e => set('phone', e.target.value)} aria-invalid={!!errors.phone} />
              {errors.phone && <span className="err-msg">{errors.phone}</span>}
            </div>
          </div>
          <div className="field" style={{ marginTop: 13 }}>
            <label htmlFor="ck-email">Email</label>
            <input id="ck-email" type="email" className={'input' + (errors.email ? ' err' : '')} value={form.email} autoComplete="email"
              onChange={e => set('email', e.target.value)} aria-invalid={!!errors.email} />
            {errors.email && <span className="err-msg">{errors.email}</span>}
          </div>
        </section>

        <section className="card-p reveal">
          <h2 className="sec-title" style={{ fontSize: '.98rem', marginBottom: 4 }}>Delivery address</h2>
          <p className="sec-sub" style={{ marginBottom: 12 }}>Fetch current location on the satellite map — address auto-fills.</p>
          {app.addresses.length > 0 && (
            <div style={{ marginBottom: 14 }}>
              <p className="opt-label" style={{ marginBottom: 0 }}>Saved addresses</p>
              <div className="opt-row" role="group" aria-label="Saved addresses">
                {app.addresses.map(a => {
                  const on = form.address === a.address && (!a.city || form.city === a.city);
                  return (
                    <button type="button" key={a.id} className={'size' + (on ? ' on' : '')}
                      style={{ minWidth: 0, maxWidth: '100%', display: 'inline-flex', alignItems: 'center', gap: 7 }}
                      aria-pressed={on}
                      onClick={() => {
                        set('address', a.address); if (a.city) set('city', a.city);
                        if (a.state) set('state', a.state); if (a.zip) set('zip', a.zip);
                        if (a.lat != null) setGeo({ lat: a.lat, lng: a.lng });
                        app.toast('Using saved address \u201C' + a.label + '\u201D', 'pin');
                      }}>
                      <Icon name="pin" size={14} /> {a.label}
                    </button>
                  );
                })}
              </div>
            </div>
          )}
          <LocationMap onPick={loc => {
            setGeo({ lat: loc.lat, lng: loc.lng });
            if (loc.address) set('address', loc.address);
            if (loc.city) set('city', loc.city);
            if (loc.state) set('state', loc.state);
            if (loc.zip) set('zip', loc.zip);
            app.toast('Address filled from your location', 'pin');
          }} />
          <div className="field" style={{ marginTop: 14 }}>
            <label htmlFor="ck-address">Street address</label>
            <input id="ck-address" className={'input' + (errors.address ? ' err' : '')} value={form.address} autoComplete="street-address"
              onChange={e => set('address', e.target.value)} aria-invalid={!!errors.address} />
            {errors.address && <span className="err-msg">{errors.address}</span>}
          </div>
          <div className="form-2" style={{ marginTop: 13 }}>
            <div className="field">
              <label htmlFor="ck-city">City</label>
              <input id="ck-city" className={'input' + (errors.city ? ' err' : '')} value={form.city} autoComplete="address-level2"
                onChange={e => set('city', e.target.value)} aria-invalid={!!errors.city} />
              {errors.city && <span className="err-msg">{errors.city}</span>}
            </div>
            <div className="field">
              <label htmlFor="ck-state">State</label>
              <input id="ck-state" className={'input' + (errors.state ? ' err' : '')} value={form.state} autoComplete="address-level1"
                onChange={e => set('state', e.target.value)} aria-invalid={!!errors.state} />
              {errors.state && <span className="err-msg">{errors.state}</span>}
            </div>
          </div>
          <div className="field" style={{ marginTop: 13 }}>
            <label htmlFor="ck-zip">ZIP code</label>
            <input id="ck-zip" className={'input' + (errors.zip ? ' err' : '')} value={form.zip} autoComplete="postal-code"
              onChange={e => set('zip', e.target.value)} aria-invalid={!!errors.zip} />
            {errors.zip && <span className="err-msg">{errors.zip}</span>}
          </div>
        </section>

        <section className="stack reveal" style={{ gap: 10 }}>
          <h2 className="sec-title" style={{ fontSize: '.98rem' }}>Payment method</h2>
          {PAYMENTS.map(p => (
            <button type="button" key={p.id} className={'pay' + (payment === p.id ? ' on' : '')}
              aria-pressed={payment === p.id} onClick={() => setPayment(p.id)}>
              <span className="pay-ico"><Icon name={p.icon} size={19} /></span>
              <span style={{ flex: 1 }}>
                <span className="pay-name" style={{ display: 'block' }}>{p.name}</span>
                <span className="pay-desc">{p.desc}</span>
              </span>
              <span className="radio" aria-hidden="true" />
            </button>
          ))}
          <div className="demo-note">
            <Icon name="shield" size={16} style={{ flex: 'none', marginTop: 1 }} />
            <span><strong>Demo mode.</strong> {app.siteName} does not process real payments and no payment gateway is connected. Placing an order only creates a sample order in your browser.</span>
          </div>
        </section>
      </div>

      <aside>
        <OrderSummary subtotal={subtotal} shipping={shipping} total={total} savings={savings} title="Your order"
          footer={<div className="stack" style={{ gap: 10, marginTop: 16 }}>
            <button type="submit" className="btn btn-primary btn-block" disabled={placing}>
              {placing ? <><span className="dots-load"><i></i><i></i><i></i></span> Placing order…</> : <>Place Order · {money(total)}</>}
            </button>
            <button type="button" className="btn btn-ghost btn-block" onClick={() => navigate('cart')}>Back to bag</button>
          </div>}>
          <div className="stack" style={{ gap: 11, margin: '10px 0 14px', paddingBottom: 14, borderBottom: '1px dashed var(--line)' }}>
            {cartLines.map(l => (
              <div className="row" key={l.key} style={{ gap: 11, alignItems: 'flex-start' }}>
                <div style={{ position: 'relative', flex: 'none' }}>
                  <Img src={l.product.images[0]} alt={l.product.name} style={{ width: 52, height: 66, borderRadius: 10, objectFit: 'cover' }} />
                  <span style={{ position: 'absolute', top: -7, right: -7, background: 'var(--charcoal)', color: '#fff', borderRadius: 999, minWidth: 20, height: 20, display: 'grid', placeItems: 'center', fontSize: '.68rem', fontWeight: 700 }}>{l.qty}</span>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={{ fontSize: '.82rem', fontWeight: 600, lineHeight: 1.3 }}>{l.product.name}</p>
                  <p className="li-meta">Size {l.size}</p>
                </div>
                <span style={{ fontSize: '.85rem', fontWeight: 700 }}>{money(l.lineTotal)}</span>
              </div>
            ))}
          </div>
        </OrderSummary>
      </aside>
    </form>
  );
}

    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  }, []);

      <div className="empty">

    <div className="confirm">

const PROTECTED_VIEWS = ['wishlist', 'orders', 'profile', 'cart', 'checkout'];

/* kicks guests off protected pages and opens the auth modal */
function AuthGate({ route, onForceHome }) {
  const { user, setAuthOpen } = useApp();
  useEffect(() => {
    if (!user && PROTECTED_VIEWS.indexOf(route.view) > -1) {
      setAuthOpen(true);
      onForceHome();
    }
  }, [route.view, user, setAuthOpen, onForceHome]);
  return null;
}

const PAGE_META = {
  product: { title: 'Product', back: true },
  cart: { title: 'Shopping Bag', back: true },
  wishlist: { title: 'My Wishlist', back: true },
  search: { title: 'Search & Filter', back: true },
  collections: { title: 'Collections', back: true },
  collection: { title: 'Collection', back: true },
  offer: { title: 'Today\u2019s Offer', back: true },
  profile: { title: 'My Profile', back: true },
  orders: { title: 'My Orders', back: true },
  checkout: { title: 'Checkout', back: true },
  confirmation: { title: 'Order Confirmed', back: false }
};

function App() {
  const [route, setRoute] = useState({ view: 'home', params: {} });
  const [lastOrder, setLastOrder] = useState(null);
  const [catalogVersion, setCatalogVersion] = useState(0);
  const isDesktop = useMediaQuery('(min-width:1024px)');

  /* load catalogue from Firestore (falls back to demo data), then keep it live */
  useEffect(() => {
    renderApp = () => setCatalogVersion(v => v + 1);
    let alive = true;
    loadCatalog().then(() => { if (alive) setCatalogVersion(v => v + 1); });
    return () => { alive = false; renderApp = function () {}; };
  }, []);

  const routeRef = useRef(route);
  routeRef.current = route;
  const stackRef = useRef([]);

  const navigate = useCallback((view, paramKeyOrParams, maybeId) => {
    const params = (typeof paramKeyOrParams === 'string')
      ? { [paramKeyOrParams]: maybeId }
      : (paramKeyOrParams || {});
    const cur = routeRef.current;
    routeRef.current = { view, params };
    setRoute({ view, params });
    if (cur.view !== view) stackRef.current = stackRef.current.concat([cur]);
  }, []);

  const goBack = useCallback(() => {
    const stack = stackRef.current;
    if (!stack.length) return;
    const last = stack[stack.length - 1];
    stackRef.current = stack.slice(0, -1);
    routeRef.current = last;
    setRoute(last);
  }, []);

  useEffect(() => { window.scrollTo({ top: 0, behavior: 'auto' }); }, [route.view, route.params && route.params.id]);

  const revealRef = useReveal();
  const routeKey = route.view + ':' + ((route.params && (route.params.id || route.params.q || route.params.cat || route.params.brand)) || '');

  const openProduct = useCallback(id => navigate('product', { id }), [navigate]);

  const forceHome = useCallback(() => {
    routeRef.current = { view: 'home', params: {} };
    setRoute({ view: 'home', params: {} });
  }, []);

  let page = null;
  switch (route.view) {
    case 'home':
      page = <HomePage navigate={navigate} params={route.params} />;
      break;
    case 'product': {
      const p = PRODUCT_MAP[route.params.id];
      page = p
        ? <ProductDetails product={p} navigate={navigate} />
        : <div className="empty"><h3>Product not found</h3><p>This item may have been removed from the catalogue.</p>
          <button className="btn btn-primary" onClick={() => navigate('home')}>Back to home</button></div>;
      break;
    }
    case 'cart': page = <CartPage navigate={navigate} />; break;
    case 'wishlist': page = <WishlistPage navigate={navigate} />; break;
    case 'search': page = <SearchPage navigate={navigate} params={route.params} />; break;
    case 'collections': page = <CollectionsPage navigate={navigate} params={null} />; break;
    case 'collection': page = <CollectionsPage navigate={navigate} params={route.params} />; break;
    case 'offer': page = <OfferPage navigate={navigate} params={route.params} />; break;
    case 'profile': page = <ProfilePage navigate={navigate} onBack={goBack} />; break;
    case 'orders': page = <OrdersPage navigate={navigate} onBack={goBack} />; break;
    case 'checkout': page = <CheckoutPage navigate={navigate} onBack={goBack} onPlaced={order => { setLastOrder(order); navigate('confirmation'); }} />; break;
    case 'confirmation': page = <ConfirmationPage order={lastOrder} navigate={navigate} />; break;
    default: page = <HomePage navigate={navigate} params={route.params} />;
  }

  const meta = PAGE_META[route.view] || null;
  const showHead = !!meta && route.view !== 'home';

  return (
    <AppProvider catalogVersion={catalogVersion}>
      <div className="app">
        <AuthGate route={route} onForceHome={forceHome} />
        <AuthModal />
        <Header route={route} navigate={navigate} />
        <main className="main" ref={revealRef}>
          {showHead && (
            <div className="page-head">
              <button className="back-btn" onClick={goBack} aria-label="Go back"><Icon name="left" size={18} /></button>
              <h1 className="page-title" style={{ flex: 1 }}>{meta.title}</h1>
              {route.view === 'cart' && <CartHeadCount />}
            </div>
          )}
          <div className="page" key={routeKey}>{page}</div>
        </main>
        {!isDesktop && <BottomNav route={route} navigate={navigate} />}
        <Toasts />
      </div>
    </AppProvider>
  );
}

function CartHeadCount() {
  const { cartCount } = useApp();
  const n = useCountUp(cartCount);
  if (!n) return null;
  return <span className="free-pill"><Icon name="bag" size={14} /> {n} item{n === 1 ? '' : 's'}</span>;
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
